<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校长贪腐人生模拟器</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --card: #0f3460;
            --gold: #e8b923;
            --red: #e94560;
            --green: #2ecc71;
            --text: #eee;
            --dim: #999;
            --border: #2a2a4a;
            --btn-bg: #1a3a5c;
            --btn-hover: #234a75;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(232, 185, 35, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(233, 69, 96, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(15, 52, 96, 0.3) 0%, transparent 50%);
        }

        .game-container {
            width: 100%;
            max-width: 820px;
            background: var(--panel);
            border-radius: 20px;
            padding: 28px 30px;
            box-shadow: var(--shadow), 0 0 60px rgba(232, 185, 35, 0.08);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--red), var(--gold));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--gold), #ffd700, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin-bottom: 4px;
        }

        .header .subtitle {
            color: var(--dim);
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 12px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 0 0 var(--radius) var(--radius);
        }

        .stat-card.age-stat::after {
            background: #3498db;
        }
        .stat-card.position-stat::after {
            background: var(--gold);
        }
        .stat-card.money-stat::after {
            background: var(--green);
        }
        .stat-card.risk-stat::after {
            background: var(--red);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-value.age-val {
            color: #3498db;
        }
        .stat-value.position-val {
            color: var(--gold);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
        }
        .stat-value.money-val {
            color: var(--green);
        }
        .stat-value.risk-val {
            color: var(--red);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #1a1a3a;
            border-radius: 10px;
            margin-top: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .bar-risk {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
        }
        .bar-integrity {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .current-stage {
            text-align: center;
            margin: 16px 0 18px;
            padding: 14px;
            background: rgba(15, 52, 96, 0.5);
            border-radius: var(--radius);
            border: 1px dashed var(--gold);
            position: relative;
        }

        .current-stage .stage-label {
            font-size: 0.8rem;
            color: var(--dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .current-stage .stage-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold);
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .current-stage .stage-desc {
            font-size: 0.85rem;
            color: var(--dim);
            margin-top: 4px;
        }

        .actions-title {
            font-size: 0.9rem;
            color: var(--dim);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .actions-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .action-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 14px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: left;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            background: var(--btn-hover);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 185, 35, 0.15);
        }

        .action-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border-color: var(--border);
        }

        .action-btn .action-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn .action-desc {
            font-size: 0.8rem;
            color: var(--dim);
            line-height: 1.4;
        }

        .action-btn .action-effects {
            font-size: 0.75rem;
            margin-top: 6px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .effect-tag {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .effect-money {
            background: rgba(46, 204, 113, 0.2);
            color: var(--green);
        }
        .effect-risk {
            background: rgba(233, 69, 96, 0.2);
            color: var(--red);
        }
        .effect-integrity {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .log-area {
            background: #0a0a1a;
            border-radius: var(--radius);
            padding: 14px 16px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .log-area::-webkit-scrollbar {
            width: 5px;
        }
        .log-area::-webkit-scrollbar-track {
            background: #0a0a1a;
        }
        .log-area::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            animation: fadeIn 0.4s ease;
        }

        .log-entry.log-good {
            color: var(--green);
        }
        .log-entry.log-bad {
            color: var(--red);
        }
        .log-entry.log-warn {
            color: var(--gold);
        }
        .log-entry.log-info {
            color: #aab;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeInBg 0.4s ease;
        }

        @keyframes fadeInBg {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--panel);
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 60px rgba(232, 185, 35, 0.3);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--gold);
        }

        .modal .ending-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .modal p {
            color: var(--dim);
            line-height: 1.7;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .modal .final-stats {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            text-align: left;
        }

        .modal .final-stats div {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .modal .final-stats div:last-child {
            border-bottom: none;
        }

        .modal .btn-restart {
            background: var(--gold);
            color: #1a1a2e;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .modal .btn-restart:hover {
            background: #ffd700;
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(232, 185, 35, 0.4);
        }

        .integrity-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .integrity-row .label {
            font-size: 0.7rem;
            color: var(--dim);
            white-space: nowrap;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 16px 14px;
                border-radius: 14px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .actions-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .header h1 {
                font-size: 1.5rem;
                letter-spacing: 1px;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .current-stage .stage-name {
                font-size: 1.2rem;
            }
            .modal {
                padding: 20px;
            }
            .modal h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="header">
            <h1>🏫 校长贪腐人生</h1>
            <div class="subtitle">学校版·权力与诱惑</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card age-stat">
                <div class="stat-label">年龄</div>
                <div class="stat-value age-val" id="statAge">35</div>
            </div>
            <div class="stat-card position-stat">
                <div class="stat-label">职位</div>
                <div class="stat-value position-val" id="statPosition">教务主任</div>
            </div>
            <div class="stat-card money-stat">
                <div class="stat-label">赃款（万）</div>
                <div class="stat-value money-val" id="statMoney">0</div>
            </div>
            <div class="stat-card risk-stat">
                <div class="stat-label">风险值</div>
                <div class="stat-value risk-val" id="statRisk">0</div>
                <div class="progress-bar-container">
                    <div class="progress-bar bar-risk" id="riskBar" style="width:0%"></div>
                </div>
            </div>
        </div>

        <div class="current-stage">
            <div class="stage-label">当前阶段</div>
            <div class="stage-name" id="stageName">主任阶段</div>
            <div class="stage-desc" id="stageDesc">手中有权，开始接触学校资源</div>
        </div>

        <div class="actions-title">📋 选择你的贪腐手段</div>
        <div class="actions-grid" id="actionsGrid">
            <!-- 动态生成 -->
        </div>

        <div class="actions-title">📜 校长生涯记录</div>
        <div class="log-area" id="logArea">
            <div class="log-entry log-info">🔰 骆校长，35岁，担任教务主任，管理学校教学事务。</div>
            <div class="log-entry log-info">💭 面对学校经费和供应商的诱惑，他会如何选择？</div>
        </div>

        <div class="btn-row">
            <button class="btn-secondary" id="btnReset">🔄 重新开始</button>
        </div>
    </div>

    <!-- 结局弹窗 -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal">
            <div class="ending-icon" id="endingIcon">🏛️</div>
            <h2 id="endingTitle">结局</h2>
            <div class="final-stats" id="finalStats"></div>
            <p id="endingDesc"></p>
            <button class="btn-restart" id="btnRestartModal">🔄 再来一世</button>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 游戏状态 ====================
            const state = {
                age: 35,
                position: '教务主任',
                positionLevel: 0, // 0=教务主任,1=副校长,2=校长,3=教育局副局长,4=教育局局长
                money: 0, // 万元
                risk: 0, // 0-100
                integrity: 50, // 清廉度 0-100，越低越腐败
                stage: 'director',
                alive: true,
                imprisoned: false,
                fled: false,
                log: [],
                gameOver: false,
                currentActions: [],
                actionCount: 0,
            };

            // ==================== 职位体系 ====================
            const positions = [
                { name: '教务主任', level: 0, stage: 'director', desc: '管理教学事务，小有实权' },
                { name: '副校长', level: 1, stage: 'director', desc: '分管后勤与基建，油水渐多' },
                { name: '校长', level: 2, stage: 'principal', desc: '一校之长，大权在握' },
                { name: '教育局副局长', level: 3, stage: 'principal', desc: '主管全市学校，资源丰富' },
                { name: '教育局局长', level: 4, stage: 'bureau', desc: '教育系统最高权力，呼风唤雨' },
            ];

            const stages = {
                director: { name: '主任阶段', desc: '手中有权，开始接触学校资源' },
                principal: { name: '校长阶段', desc: '一校之主，项目与经费源源不断' },
                bureau: { name: '局长阶段', desc: '教育系统巨擘，风险与利益并存' },
            };

            // ==================== 贪腐行为定义 ====================
            const actionsByStage = {
                director: [
                    { id: 'textbook_kickback', name: '📚 教材采购回扣', desc: '在教材采购中收取供应商回扣，金额不大。',
                        effects: { money: [2, 8], risk: [3, 8], integrity: -2 },
                        logGood: '教材回扣到手，数目不大但很稳定。',
                        logBad: '有老师举报教材价格偏高，引起注意！', minRisk: 0, maxRisk: 70 },
                    { id: 'uniform_kickback', name: '👕 校服采购提成', desc: '指定校服供应商，按比例拿提成。',
                        effects: { money: [1, 5], risk: [2, 6], integrity: -1 },
                        logGood: '校服提成到账，家长暂时没意见。',
                        logBad: '家长投诉校服质量，你被约谈！', minRisk: 0, maxRisk: 65 },
                    { id: 'fake_activity', name: '🎪 虚报活动经费', desc: '虚报学生活动开支，套取学校资金。',
                        effects: { money: [0.5, 3], risk: [1, 4], integrity: -1 },
                        logGood: '活动经费虚报了一点，神不知鬼不觉。',
                        logBad: '财务审计发现漏洞，被记了一笔！', minRisk: 0, maxRisk: 60 },
                    { id: 'work_promotion', name: '📈 踏实工作（升职）', desc: '暂时收敛，积累业绩，争取升任副校长。',
                        effects: { money: 0, risk: -5, integrity: 5 },
                        logGood: '工作出色，领导赏识，升职在望！',
                        logBad: '错过了一些"机会"，但至少睡得安稳。', minRisk: 0, maxRisk: 100,
                    isPromotion: true },
                ],
                principal: [
                    { id: 'construction_kickback', name: '🏗️ 基建工程回扣', desc: '学校教学楼、操场建设，收取工程回扣。',
                        effects: { money: [10, 30], risk: [8, 18], integrity: -5 },
                        logGood: '基建回扣到手，数目可观。',
                        logBad: '工程质量问题被曝光，你被牵连！', minRisk: 0, maxRisk: 75 },
                    { id: 'canteen_contract', name: '🍱 食堂承包受贿', desc: '将食堂承包给特定公司，收取好处费。',
                        effects: { money: [8, 25], risk: [10, 20], integrity: -6 },
                        logGood: '食堂承包费到账，家长暂时没发现。',
                        logBad: '学生食物中毒，食堂问题被彻查！', minRisk: 0, maxRisk: 70 },
                    { id: 'enrollment_bribe', name: '🎓 违规招生收费', desc: '收受家长贿赂，违规录取学生。',
                        effects: { money: [5, 15], risk: [6, 15], integrity: -4 },
                        logGood: '又安排了一个学生，收到一笔"赞助费"。',
                        logBad: '家长反水举报，招生黑幕曝光！', minRisk: 0, maxRisk: 72 },
                    { id: 'work_promotion', name: '📈 积极表现（升职）', desc: '创造政绩，争取进入教育局。',
                        effects: { money: 0, risk: -8, integrity: 6 },
                        logGood: '学校成绩突出，教育局开始考察你！',
                        logBad: '竞争激烈，还需更多"成绩"。', minRisk: 0, maxRisk: 100,
                    isPromotion: true },
                    { id: 'embezzle_fund', name: '💰 挪用教育经费', desc: '将上级拨付的教育经费挪作他用。',
                        effects: { money: [20, 50], risk: [15, 28], integrity: -8 },
                        logGood: '经费暂时挪用，赚了一笔再还回去。',
                        logBad: '上级检查发现经费去向不明！', minRisk: 0, maxRisk: 65 },
                ],
                bureau: [
                    { id: 'project_allocation', name: '🏢 项目审批受贿', desc: '审批学校项目时收取巨额贿赂。',
                        effects: { money: [30, 80], risk: [15, 30], integrity: -10 },
                        logGood: '项目审批通过，好处费到账。',
                        logBad: '纪委介入调查项目审批流程！', minRisk: 0, maxRisk: 70 },
                    { id: 'embezzle_massive', name: '💼 侵吞教育专款', desc: '通过复杂操作侵吞教育专项拨款。',
                        effects: { money: [25, 70], risk: [18, 35], integrity: -10 },
                        logGood: '教育专款被转移，没人发现。',
                        logBad: '审计发现重大资金缺口，矛头直指你！', minRisk: 0, maxRisk: 65 },
                    { id: 'protection', name: '🛡️ 充当学校保护伞', desc: '为问题学校提供庇护，收取保护费。',
                        effects: { money: [15, 40], risk: [12, 25], integrity: -8 },
                        logGood: '保护费到账，问题学校继续运营。',
                        logBad: '学校安全事故被曝光，你被追责！', minRisk: 0, maxRisk: 68 },
                    { id: 'work_promotion', name: '📈 政绩工程（升迁）', desc: '搞教育形象工程，虽然花钱但能升迁。',
                        effects: { money: -5, risk: -10, integrity: 3 },
                        logGood: '形象工程受到表彰，上级赏识！',
                        logBad: '工程被曝浪费资金，声誉受损。', minRisk: 0, maxRisk: 100, isPromotion: true },
                    { id: 'flee_attempt', name: '✈️ 转移资产准备外逃', desc: '将资产转移到海外，准备随时跑路。',
                        effects: { money: -10, risk: 5, integrity: -5 },
                        logGood: '资产已转移到海外账户，后路有了。',
                        logBad: '资产转移被监控，惊动了有关部门！', minRisk: 0, maxRisk: 60 },
                ],
            };

            // ==================== 随机事件 ====================
            const randomEvents = [
                { id: 'education_audit', name: '📋 教育局审计', desc: '教育局突然开展财务审计，所有账目被翻查。', apply: (s) => { if (s.money > 20) { s
                            .risk += 15; addLog('审计发现了一些异常，风险上升！', 'log-warn'); } else { addLog(
                            '审计未发现大问题，虚惊一场。', 'log-good'); } }, weight: 3 },
                { id: 'parent_report', name: '📢 家长举报', desc: '有家长向教育局举报学校乱收费。', apply: (s) => { if (s.integrity < 35) { s
                            .risk += 20;
                        addLog('举报内容翔实，教育局开始调查！', 'log-bad'); } else { addLog('举报内容模糊，暂时未引起重视。', 'log-info'); } },
                    weight: 3 },
                { id: 'promotion_chance', name: '🌟 升迁机会', desc: '上级职位有空缺，你有机会晋升。', apply: (s) => { if (s.integrity > 40) { s
                            .risk -= 10;
                        addLog('你表现良好，获得升迁机会！', 'log-good');
                        promoteIfPossible(s); } else { addLog('虽然有机会，但你的作风问题被人议论。', 'log-warn'); } },
                    weight: 2 },
                { id: 'colleague_arrested', name: '🚨 同僚落马', desc: '你的同事因贪腐被纪检带走。', apply: (s) => { if (s.integrity < 30) { s
                            .risk += 15;
                        addLog('同僚落马，你坐立不安，风险大增！', 'log-bad'); } else { s.risk -= 5;
                        addLog('同僚落马，你与他的关系并不密切。', 'log-info'); } }, weight: 2 },
                { id: 'lucky_escape', name: '🍀 侥幸过关', desc: '一次检查中，你的问题差点被发现。', apply: (s) => { if (s.risk > 50) { s.risk -=
                            10;
                        addLog('运气不错，暂时躲过一劫。', 'log-good'); } else { addLog('检查平淡无奇，没有异常。', 'log-info'); } },
                    weight: 3 },
                { id: 'family_warning', name: '👨‍👩‍👦 家人劝诫', desc: '家人发现你行为异常，劝你悬崖勒马。', apply: (s) => { s.integrity += 5; s
                        .risk -= 5;
                    addLog('家人的话让你有所触动，稍微收敛。', 'log-info'); }, weight: 2 },
                { id: 'media_expose', name: '📰 媒体曝光', desc: '有媒体开始关注你学校的问题。', apply: (s) => { if (s.money > 50) { s.risk +=
                            18;
                        addLog('媒体曝光了学校问题，舆论压力巨大！', 'log-bad'); } else { addLog('媒体报道未涉及你个人。', 'log-info'); } },
                    weight: 2 },
                { id: 'bonus', name: '🎉 合法收入', desc: '你发表论文或获得奖励，获得合法收入。', apply: (s) => { s.money += 5;
                        addLog('合法收入到账，心里踏实。', 'log-good'); }, weight: 2 },
            ];

            // ==================== 工具函数 ====================
            function rand(min, max) {
                return Math.random() * (max - min) + min;
            }

            function randInt(min, max) {
                return Math.floor(rand(min, max + 1));
            }

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function addLog(text, cls = 'log-info') {
                state.log.push({ text, cls });
                const logArea = document.getElementById('logArea');
                const entry = document.createElement('div');
                entry.className = `log-entry ${cls}`;
                entry.textContent = text;
                logArea.appendChild(entry);
                logArea.scrollTop = logArea.scrollHeight;
                while (logArea.children.length > 60) {
                    logArea.removeChild(logArea.firstChild);
                }
            }

            function getPositionByLevel(level) {
                const idx = clamp(level, 0, positions.length - 1);
                return positions[idx];
            }

            function getStageByLevel(level) {
                if (level <= 1) return 'director';
                if (level <= 3) return 'principal';
                return 'bureau';
            }

            function promoteIfPossible(s) {
                if (s.positionLevel < positions.length - 1) {
                    s.positionLevel++;
                    const pos = getPositionByLevel(s.positionLevel);
                    s.position = pos.name;
                    s.stage = pos.stage;
                    addLog(`🚀 晋升为【${pos.name}】！`, 'log-good');
                    updateUI();
                    return true;
                }
                return false;
            }

            function updateUI() {
                document.getElementById('statAge').textContent = state.age;
                document.getElementById('statPosition').textContent = state.position;
                document.getElementById('statMoney').textContent = state.money.toFixed(1);
                document.getElementById('statRisk').textContent = Math.round(state.risk);
                document.getElementById('riskBar').style.width = clamp(state.risk, 0, 100) + '%';

                const stageInfo = stages[state.stage] || stages.director;
                document.getElementById('stageName').textContent = stageInfo.name;
                document.getElementById('stageDesc').textContent = stageInfo.desc;
            }

            function getAvailableActions() {
                const stage = state.stage;
                const actions = actionsByStage[stage] || actionsByStage.director;
                let available = actions.filter(a => state.risk <= (a.maxRisk || 100));
                if (available.length === 0) {
                    available = actions.filter(a => a.isPromotion || (a.effects.risk && a.effects.risk[0] <= 10));
                }
                return available;
            }

            function renderActions() {
                const grid = document.getElementById('actionsGrid');
                grid.innerHTML = '';
                const actions = getAvailableActions();
                state.currentActions = actions;

                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = `
                <div class="action-name">${action.name}</div>
                <div class="action-desc">${action.desc}</div>
                <div class="action-effects">
                  ${action.effects.money ? `<span class="effect-tag effect-money">💰 ${action.effects.money[0]}-${action.effects.money[1]}万</span>` : ''}
                  ${action.effects.risk ? `<span class="effect-tag effect-risk">⚠️ 风险 ${action.effects.risk[0]}-${action.effects.risk[1]}</span>` : ''}
                  ${action.effects.integrity ? `<span class="effect-tag effect-integrity">🧭 清廉 ${action.effects.integrity > 0 ? '+' : ''}${action.effects.integrity}</span>` : ''}
                </div>
              `;
                    btn.addEventListener('click', () => performAction(action));
                    grid.appendChild(btn);
                });
            }

            function performAction(action) {
                if (state.gameOver) return;
                state.actionCount++;

                state.age += randInt(1, 3);
                if (state.age > 70) state.age = 70;

                if (action.effects.money) {
                    const val = rand(action.effects.money[0], action.effects.money[1]);
                    state.money += val;
                    if (val > 0) addLog(`+${val.toFixed(1)}万 赃款入账。`, 'log-info');
                    if (val < 0) addLog(`支出 ${Math.abs(val).toFixed(1)}万。`, 'log-info');
                }
                if (action.effects.risk) {
                    const val = rand(action.effects.risk[0], action.effects.risk[1]);
                    state.risk += val;
                    if (val > 0) addLog(`⚠️ 风险上升 ${val.toFixed(1)}。`, 'log-warn');
                    if (val < 0) addLog(`✅ 风险下降 ${Math.abs(val).toFixed(1)}。`, 'log-good');
                }
                if (action.effects.integrity) {
                    state.integrity = clamp(state.integrity + action.effects.integrity, 0, 100);
                }

                state.risk = clamp(state.risk, 0, 100);
                state.money = Math.max(0, state.money);
                state.integrity = clamp(state.integrity, 0, 100);

                if (action.isPromotion) {
                    if (Math.random() < 0.55) {
                        promoteIfPossible(state);
                    } else {
                        addLog('升迁暂时无望，继续努力。', 'log-warn');
                    }
                }

                if (action.logGood && Math.random() < 0.65) {
                    addLog(action.logGood, 'log-good');
                } else if (action.logBad) {
                    addLog(action.logBad, 'log-bad');
                }

                if (Math.random() < 0.35 && state.actionCount > 1) {
                    triggerRandomEvent();
                }

                checkArrest();

                if (!state.gameOver) {
                    checkEndings();
                }

                updateUI();

                if (!state.gameOver) {
                    renderActions();
                }
            }

            function triggerRandomEvent() {
                const totalWeight = randomEvents.reduce((sum, e) => sum + e.weight, 0);
                let roll = Math.random() * totalWeight;
                for (const ev of randomEvents) {
                    roll -= ev.weight;
                    if (roll <= 0) {
                        addLog(`【事件】${ev.name}：${ev.desc}`, 'log-warn');
                        ev.apply(state);
                        break;
                    }
                }
                updateUI();
            }

            function checkArrest() {
                const arrestChance = state.risk / 100;
                const roll = Math.random();
                if (roll < arrestChance * 0.35 && state.risk > 40) {
                    state.gameOver = true;
                    state.imprisoned = true;
                    showEnding('imprisoned');
                } else if (state.risk >= 100) {
                    state.gameOver = true;
                    state.imprisoned = true;
                    showEnding('imprisoned');
                } else if (state.risk > 70 && Math.random() < 0.1) {
                    addLog('🚨 纪检已对你展开初步调查，情况危急！', 'log-bad');
                    state.risk += 5;
                }
            }

            function checkEndings() {
                if (state.gameOver) return;
                if (state.age >= 60 && state.risk < 30) {
                    state.gameOver = true;
                    showEnding('retired_safe');
                    return;
                }
                if (state.age >= 65) {
                    if (state.risk > 50) {
                        state.gameOver = true;
                        showEnding('retired_risky');
                    } else {
                        state.gameOver = true;
                        showEnding('retired_safe');
                    }
                    return;
                }
                if (state.money >= 500 && state.risk > 60) {
                    state.gameOver = true;
                    showEnding('fled');
                    return;
                }
                if (state.money >= 1000) {
                    state.gameOver = true;
                    showEnding('mega_corrupt');
                    return;
                }
                if (state.integrity <= 10 && state.risk > 50) {
                    state.gameOver = true;
                    showEnding('exposed');
                    return;
                }
            }

            function showEnding(type) {
                const overlay = document.getElementById('modalOverlay');
                overlay.classList.remove('hidden');

                const iconEl = document.getElementById('endingIcon');
                const titleEl = document.getElementById('endingTitle');
                const statsEl = document.getElementById('finalStats');
                const descEl = document.getElementById('endingDesc');

                const endings = {
                    imprisoned: {
                        icon: '⛓️',
                        title: '锒铛入狱',
                        desc: '纪检部门掌握了确凿证据，你被带走调查。最终因贪污受贿罪被判处有期徒刑。铁窗之内，你回顾一生，悔之晚矣。'
                    },
                    retired_safe: {
                        icon: '🏖️',
                        title: '平稳着陆',
                        desc: '你在教育系统摸爬滚打一生，虽有小贪但未触及红线，最终安全退休。那些不义之财，成了你晚年的"保障"。'
                    },
                    retired_risky: {
                        icon: '😰',
                        title: '退休前的噩梦',
                        desc: '即将退休之际，纪检突然介入调查你早年间的贪腐问题。晚节不保，你的人生以悲剧收场。'
                    },
                    fled: {
                        icon: '✈️',
                        title: '卷款外逃',
                        desc: '你察觉到风声不对，带着巨额赃款潜逃海外。虽然暂时逃脱了法律制裁，但余生都在恐惧和悔恨中度过。'
                    },
                    mega_corrupt: {
                        icon: '👑',
                        title: '巨贪校长',
                        desc: '你贪腐金额超过千万，成为震惊教育界的大案。虽然享受了极致的奢华，但最终难逃法网。'
                    },
                    exposed: {
                        icon: '📸',
                        title: '东窗事发',
                        desc: '你的贪腐行为被全面曝光，身败名裂。不仅失去了所有，还连累了家人。'
                    },
                };

                const ending = endings[type] || endings.imprisoned;
                iconEl.textContent = ending.icon;
                titleEl.textContent = ending.title;
                descEl.textContent = ending.desc;

                statsEl.innerHTML = `
              <div><span>最终年龄</span><span>${state.age} 岁</span></div>
              <div><span>最终职位</span><span>${state.position}</span></div>
              <div><span>贪污金额</span><span>${state.money.toFixed(1)} 万元</span></div>
              <div><span>风险值</span><span>${Math.round(state.risk)} / 100</span></div>
              <div><span>清廉度</span><span>${Math.round(state.integrity)} / 100</span></div>
              <div><span>人生选择次数</span><span>${state.actionCount} 次</span></div>
            `;
            }

            function resetGame() {
                state.age = 35;
                state.position = '教务主任';
                state.positionLevel = 0;
                state.money = 0;
                state.risk = 0;
                state.integrity = 50;
                state.stage = 'director';
                state.alive = true;
                state.imprisoned = false;
                state.fled = false;
                state.gameOver = false;
                state.actionCount = 0;
                state.log = [];
                state.currentActions = [];

                document.getElementById('logArea').innerHTML = `
              <div class="log-entry log-info">🔰 骆校长，35岁，担任教务主任，管理学校教学事务。</div>
              <div class="log-entry log-info">💭 面对学校经费和供应商的诱惑，他会如何选择？</div>
            `;
                document.getElementById('modalOverlay').classList.add('hidden');
                updateUI();
                renderActions();
            }

            // ==================== 初始化 ====================
            function init() {
                updateUI();
                renderActions();
                document.getElementById('btnReset').addEventListener('click', resetGame);
                document.getElementById('btnRestartModal').addEventListener('click', resetGame);
            }

            init();

            window.resetGame = resetGame;
        })();
    </script>
</body>
</html>
