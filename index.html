<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骆德翻·贪腐人生模拟器</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --card: #0f3460;
            --gold: #e8b923;
            --red: #e94560;
            --green: #2ecc71;
            --text: #eee;
            --dim: #999;
            --border: #2a2a4a;
            --btn-bg: #1a3a5c;
            --btn-hover: #234a75;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(232, 185, 35, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(233, 69, 96, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(15, 52, 96, 0.3) 0%, transparent 50%);
        }

        .game-container {
            width: 100%;
            max-width: 820px;
            background: var(--panel);
            border-radius: 20px;
            padding: 28px 30px;
            box-shadow: var(--shadow), 0 0 60px rgba(232, 185, 35, 0.08);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--red), var(--gold));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--gold), #ffd700, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin-bottom: 4px;
        }

        .header .subtitle {
            color: var(--dim);
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 12px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 0 0 var(--radius) var(--radius);
        }

        .stat-card.age-stat::after {
            background: #3498db;
        }
        .stat-card.position-stat::after {
            background: var(--gold);
        }
        .stat-card.money-stat::after {
            background: var(--green);
        }
        .stat-card.risk-stat::after {
            background: var(--red);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-value.age-val {
            color: #3498db;
        }
        .stat-value.position-val {
            color: var(--gold);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
        }
        .stat-value.money-val {
            color: var(--green);
        }
        .stat-value.risk-val {
            color: var(--red);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #1a1a3a;
            border-radius: 10px;
            margin-top: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .bar-risk {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
        }
        .bar-integrity {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .current-stage {
            text-align: center;
            margin: 16px 0 18px;
            padding: 14px;
            background: rgba(15, 52, 96, 0.5);
            border-radius: var(--radius);
            border: 1px dashed var(--gold);
            position: relative;
        }

        .current-stage .stage-label {
            font-size: 0.8rem;
            color: var(--dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .current-stage .stage-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold);
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .current-stage .stage-desc {
            font-size: 0.85rem;
            color: var(--dim);
            margin-top: 4px;
        }

        .actions-title {
            font-size: 0.9rem;
            color: var(--dim);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .actions-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .action-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 14px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: left;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            background: var(--btn-hover);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 185, 35, 0.15);
        }

        .action-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border-color: var(--border);
        }

        .action-btn .action-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn .action-desc {
            font-size: 0.8rem;
            color: var(--dim);
            line-height: 1.4;
        }

        .action-btn .action-effects {
            font-size: 0.75rem;
            margin-top: 6px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .effect-tag {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .effect-money {
            background: rgba(46, 204, 113, 0.2);
            color: var(--green);
        }
        .effect-risk {
            background: rgba(233, 69, 96, 0.2);
            color: var(--red);
        }
        .effect-integrity {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .log-area {
            background: #0a0a1a;
            border-radius: var(--radius);
            padding: 14px 16px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .log-area::-webkit-scrollbar {
            width: 5px;
        }
        .log-area::-webkit-scrollbar-track {
            background: #0a0a1a;
        }
        .log-area::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            animation: fadeIn 0.4s ease;
        }

        .log-entry.log-good {
            color: var(--green);
        }
        .log-entry.log-bad {
            color: var(--red);
        }
        .log-entry.log-warn {
            color: var(--gold);
        }
        .log-entry.log-info {
            color: #aab;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeInBg 0.4s ease;
        }

        @keyframes fadeInBg {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--panel);
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 60px rgba(232, 185, 35, 0.3);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--gold);
        }

        .modal .ending-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .modal p {
            color: var(--dim);
            line-height: 1.7;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .modal .final-stats {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            text-align: left;
        }

        .modal .final-stats div {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .modal .final-stats div:last-child {
            border-bottom: none;
        }

        .modal .btn-restart {
            background: var(--gold);
            color: #1a1a2e;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .modal .btn-restart:hover {
            background: #ffd700;
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(232, 185, 35, 0.4);
        }

        .integrity-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .integrity-row .label {
            font-size: 0.7rem;
            color: var(--dim);
            white-space: nowrap;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 16px 14px;
                border-radius: 14px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .actions-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .header h1 {
                font-size: 1.5rem;
                letter-spacing: 1px;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .current-stage .stage-name {
                font-size: 1.2rem;
            }
            .modal {
                padding: 20px;
            }
            .modal h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="header">
            <h1>🐍 骆德翻</h1>
            <div class="subtitle">贪腐人生模拟器 · 一生之路</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card age-stat">
                <div class="stat-label">年龄</div>
                <div class="stat-value age-val" id="statAge">28</div>
            </div>
            <div class="stat-card position-stat">
                <div class="stat-label">职位</div>
                <div class="stat-value position-val" id="statPosition">科员</div>
            </div>
            <div class="stat-card money-stat">
                <div class="stat-label">赃款（万）</div>
                <div class="stat-value money-val" id="statMoney">0</div>
            </div>
            <div class="stat-card risk-stat">
                <div class="stat-label">风险值</div>
                <div class="stat-value risk-val" id="statRisk">0</div>
                <div class="progress-bar-container">
                    <div class="progress-bar bar-risk" id="riskBar" style="width:0%"></div>
                </div>
            </div>
        </div>

        <div class="current-stage">
            <div class="stage-label">当前阶段</div>
            <div class="stage-name" id="stageName">基层起步</div>
            <div class="stage-desc" id="stageDesc">初入官场，谨慎行事</div>
        </div>

        <div class="actions-title">🀄 选择你的贪腐手段</div>
        <div class="actions-grid" id="actionsGrid">
            <!-- 动态生成 -->
        </div>

        <div class="actions-title">📜 生涯记录</div>
        <div class="log-area" id="logArea">
            <div class="log-entry log-info">🔰 骆德翻，男，28岁，进入某机关单位工作，月薪微薄。</div>
            <div class="log-entry log-info">💭 面对金钱诱惑，他究竟会做出怎样的选择？</div>
        </div>

        <div class="btn-row">
            <button class="btn-secondary" id="btnReset">🔄 重新开始</button>
        </div>
    </div>

    <!-- 结局弹窗 -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal">
            <div class="ending-icon" id="endingIcon">🏛️</div>
            <h2 id="endingTitle">结局</h2>
            <div class="final-stats" id="finalStats"></div>
            <p id="endingDesc"></p>
            <button class="btn-restart" id="btnRestartModal">🔄 再来一世</button>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 游戏状态 ====================
            const state = {
                age: 28,
                position: '科员',
                positionLevel: 0, // 0=科员,1=副科,2=正科,3=副处,4=正处,5=副厅,6=正厅
                money: 0, // 万元
                risk: 0, // 0-100
                integrity: 50, // 清廉度 0-100，越低越腐败
                stage: 'early',
                alive: true,
                imprisoned: false,
                fled: false,
                log: [],
                gameOver: false,
                currentActions: [],
                actionCount: 0,
            };

            // ==================== 职位体系 ====================
            const positions = [
                { name: '科员', level: 0, stage: 'early', desc: '基层小吏，无人关注' },
                { name: '副科长', level: 1, stage: 'early', desc: '小有权力，开始接触项目' },
                { name: '科长', level: 2, stage: 'mid', desc: '一科之主，审批权在手' },
                { name: '副处长', level: 3, stage: 'mid', desc: '处室副职，分管一方' },
                { name: '处长', level: 4, stage: 'mid', desc: '大权在握，项目资金过手' },
                { name: '副厅长', level: 5, stage: 'late', desc: '厅级干部，位高权重' },
                { name: '厅长', level: 6, stage: 'late', desc: '一方诸侯，呼风唤雨' },
            ];

            const stages = {
                early: { name: '基层起步', desc: '初入官场，谨慎行事' },
                mid: { name: '步步高升', desc: '权力渐长，诱惑增多' },
                late: { name: '位高权重', desc: '大权在握，风险与利益并存' },
            };

            // ==================== 贪腐行为定义 ====================
            const actionsByStage = {
                early: [
                    { id: 'bribe_small', name: '🎁 收受小额礼品', desc: '接受一条烟、两瓶酒，价值不高但积少成多。',
                        effects: { money: [2, 8], risk: [3, 8], integrity: -2 },
                        logGood: '收下礼品，心里有些忐忑，但似乎没人注意。',
                        logBad: '被人看到收了礼品，虽然金额不大，但已引起注意！', minRisk: 0, maxRisk: 70 },
                    { id: 'fake_reimburse', name: '📄 虚报差旅费', desc: '出差报销时多报一些费用，小打小闹。',
                        effects: { money: [1, 5], risk: [2, 6], integrity: -1 },
                        logGood: '虚报了一点差旅费，神不知鬼不觉。',
                        logBad: '财务审计发现了异常，被记了一笔！', minRisk: 0, maxRisk: 65 },
                    { id: 'eat_drink', name: '🍷 公款吃喝', desc: '借工作名义聚餐，反正不是自己掏钱。',
                        effects: { money: [0.5, 3], risk: [1, 4], integrity: -1 },
                        logGood: '又蹭了一顿好饭，何乐而不为？',
                        logBad: '有人举报公款吃喝，纪检开始关注！', minRisk: 0, maxRisk: 60 },
                    { id: 'work_promotion', name: '📈 踏实工作（升职）', desc: '暂时不贪，积累政绩和人脉，为将来铺路。',
                        effects: { money: 0, risk: -5, integrity: 5 },
                        logGood: '努力工作，领导看在眼里，升职有望！',
                        logBad: '错过了一些"机会"，但至少睡得安稳。', minRisk: 0, maxRisk: 100,
                    isPromotion: true },
                ],
                mid: [
                    { id: 'bribe_medium', name: '💰 收受工程回扣', desc: '工程项目招标中收取回扣，金额可观。',
                        effects: { money: [10, 30], risk: [8, 18], integrity: -5 },
                        logGood: '一笔回扣到手，数目不小。',
                        logBad: '工程商被抓，供出了你！风险骤增！', minRisk: 0, maxRisk: 75 },
                    { id: 'embezzle_fund', name: '🏦 挪用公款', desc: '暂时借用公款去投资，赚了再还回去。',
                        effects: { money: [8, 25], risk: [10, 20], integrity: -6 },
                        logGood: '挪用公款赚了一笔，及时归还，没人发现。',
                        logBad: '投资失败，公款无法归还，麻烦大了！', minRisk: 0, maxRisk: 70 },
                    { id: 'sell_position', name: '🎯 卖官鬻爵', desc: '安排人员岗位，收取"感谢费"。',
                        effects: { money: [5, 15], risk: [6, 15], integrity: -4 },
                        logGood: '安排了个岗位，收到一笔"心意"。',
                        logBad: '被安排的人出了事，牵连到你！', minRisk: 0, maxRisk: 72 },
                    { id: 'work_promotion', name: '📈 积极表现（升职）', desc: '暂时收敛，表现突出，争取更高职位。',
                        effects: { money: 0, risk: -8, integrity: 6 },
                        logGood: '政绩突出，组织部门开始考察你！',
                        logBad: '升职路上竞争者众多，还需努力。', minRisk: 0, maxRisk: 100,
                    isPromotion: true },
                    { id: 'bribe_big', name: '💎 收受巨额贿赂', desc: '一次性收下巨额财物，胆子越来越大。',
                        effects: { money: [20, 50], risk: [15, 28], integrity: -8 },
                        logGood: '一笔巨款到手，贪婪之心膨胀。',
                        logBad: '被行贿人举报，证据确凿！', minRisk: 0, maxRisk: 65 },
                ],
                late: [
                    { id: 'bribe_huge', name: '🏆 权钱交易', desc: '利用职务之便，为他人谋取巨大利益，收取天价报酬。',
                        effects: { money: [30, 80], risk: [15, 30], integrity: -10 },
                        logGood: '一笔天价"交易"达成，财富暴涨。',
                        logBad: '上级纪委介入调查，情况危急！', minRisk: 0, maxRisk: 70 },
                    { id: 'embezzle_massive', name: '🏢 侵吞国有资产', desc: '通过复杂操作，将国有资产据为己有。',
                        effects: { money: [25, 70], risk: [18, 35], integrity: -10 },
                        logGood: '国有资产被神不知鬼不觉地转移。',
                        logBad: '审计发现重大漏洞，矛头直指你！', minRisk: 0, maxRisk: 65 },
                    { id: 'protect_illegal', name: '🛡️ 充当保护伞', desc: '为黑恶势力提供庇护，收取保护费。',
                        effects: { money: [15, 40], risk: [12, 25], integrity: -8 },
                        logGood: '保护费到账，黑白通吃。',
                        logBad: '扫黑除恶专项行动，你被盯上了！', minRisk: 0, maxRisk: 68 },
                    { id: 'work_promotion', name: '📈 政绩工程（升迁）', desc: '搞面子工程，虽然花钱但能升迁。',
                        effects: { money: -5, risk: -10, integrity: 3 },
                        logGood: '政绩工程见效，上级赏识！',
                        logBad: '工程被曝质量问题，声誉受损。', minRisk: 0, maxRisk: 100, isPromotion: true },
                    { id: 'flee_attempt', name: '✈️ 转移资产准备外逃', desc: '将资产转移到海外，准备随时跑路。',
                        effects: { money: -10, risk: 5, integrity: -5 },
                        logGood: '资产已转移到海外账户，后路有了。',
                        logBad: '资产转移被监控，惊动了有关部门！', minRisk: 0, maxRisk: 60 },
                ],
            };

            // ==================== 随机事件 ====================
            const randomEvents = [
                { id: 'audit', name: '📋 审计风暴', desc: '上级突然开展审计，所有账目被翻查。', apply: (s) => { if (s.money > 20) { s
                            .risk += 15; addLog('审计发现了一些异常，风险上升！', 'log-warn'); } else { addLog(
                            '审计未发现大问题，虚惊一场。', 'log-good'); } }, weight: 3 },
                { id: 'whistleblower', name: '📢 群众举报', desc: '有人向纪委举报你的贪腐行为。', apply: (s) => { if (s.integrity < 35) { s
                            .risk += 20;
                        addLog('举报内容翔实，纪委开始调查！', 'log-bad'); } else { addLog('举报内容模糊，暂时未引起重视。', 'log-info'); } },
                    weight: 3 },
                { id: 'promotion_chance', name: '🌟 升迁机会', desc: '上级有职位空缺，你有机会晋升。', apply: (s) => { if (s.integrity > 40) { s
                            .risk -= 10;
                        addLog('你表现良好，获得升迁机会！', 'log-good');
                        promoteIfPossible(s); } else { addLog('虽然有机会，但你的作风问题被人议论。', 'log-warn'); } },
                    weight: 2 },
                { id: 'colleague_arrested', name: '🚨 同僚落马', desc: '你的同事因贪腐被纪委带走。', apply: (s) => { if (s.integrity < 30) { s
                            .risk += 15;
                        addLog('同僚落马，你坐立不安，风险大增！', 'log-bad'); } else { s.risk -= 5;
                        addLog('同僚落马，你与他的关系并不密切。', 'log-info'); } }, weight: 2 },
                { id: 'lucky_escape', name: '🍀 侥幸过关', desc: '一次检查中，你的问题差点被发现。', apply: (s) => { if (s.risk > 50) { s.risk -=
                            10;
                        addLog('运气不错，暂时躲过一劫。', 'log-good'); } else { addLog('检查平淡无奇，没有异常。', 'log-info'); } },
                    weight: 3 },
                { id: 'family_warning', name: '👨‍👩‍👦 家人劝诫', desc: '家人发现你行为异常，劝你悬崖勒马。', apply: (s) => { s.integrity += 5; s
                        .risk -= 5;
                    addLog('家人的话让你有所触动，稍微收敛。', 'log-info'); }, weight: 2 },
                { id: 'media_expose', name: '📰 媒体曝光', desc: '有媒体开始关注你经手的项目。', apply: (s) => { if (s.money > 50) { s.risk +=
                            18;
                        addLog('媒体曝光了项目问题，舆论压力巨大！', 'log-bad'); } else { addLog('媒体报道未涉及你个人。', 'log-info'); } },
                    weight: 2 },
                { id: 'bonus', name: '🎉 意外之财', desc: '投资获得了意外收益（非贪腐）。', apply: (s) => { s.money += 5;
                        addLog('投资小赚一笔，合法收入。', 'log-good'); }, weight: 2 },
            ];

            // ==================== 工具函数 ====================
            function rand(min, max) {
                return Math.random() * (max - min) + min;
            }

            function randInt(min, max) {
                return Math.floor(rand(min, max + 1));
            }

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function addLog(text, cls = 'log-info') {
                state.log.push({ text, cls });
                const logArea = document.getElementById('logArea');
                const entry = document.createElement('div');
                entry.className = `log-entry ${cls}`;
                entry.textContent = text;
                logArea.appendChild(entry);
                logArea.scrollTop = logArea.scrollHeight;
                // 限制日志条数
                while (logArea.children.length > 60) {
                    logArea.removeChild(logArea.firstChild);
                }
            }

            function getPositionByLevel(level) {
                const idx = clamp(level, 0, positions.length - 1);
                return positions[idx];
            }

            function getStageByLevel(level) {
                if (level <= 1) return 'early';
                if (level <= 4) return 'mid';
                return 'late';
            }

            function promoteIfPossible(s) {
                if (s.positionLevel < positions.length - 1) {
                    s.positionLevel++;
                    const pos = getPositionByLevel(s.positionLevel);
                    s.position = pos.name;
                    s.stage = pos.stage;
                    addLog(`🚀 晋升为【${pos.name}】！`, 'log-good');
                    updateUI();
                    return true;
                }
                return false;
            }

            function updateUI() {
                document.getElementById('statAge').textContent = state.age;
                document.getElementById('statPosition').textContent = state.position;
                document.getElementById('statMoney').textContent = state.money.toFixed(1);
                document.getElementById('statRisk').textContent = Math.round(state.risk);
                document.getElementById('riskBar').style.width = clamp(state.risk, 0, 100) + '%';

                const stageInfo = stages[state.stage];
                document.getElementById('stageName').textContent = stageInfo.name;
                document.getElementById('stageDesc').textContent = stageInfo.desc;
            }

            function getAvailableActions() {
                const stage = state.stage;
                const actions = actionsByStage[stage] || actionsByStage.early;
                // 根据风险过滤
                let available = actions.filter(a => state.risk <= (a.maxRisk || 100));
                if (available.length === 0) {
                    // 如果风险太高，只保留风险较低或升职选项
                    available = actions.filter(a => a.isPromotion || (a.effects.risk && a.effects.risk[0] <= 10));
                }
                return available;
            }

            function renderActions() {
                const grid = document.getElementById('actionsGrid');
                grid.innerHTML = '';
                const actions = getAvailableActions();
                state.currentActions = actions;

                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = `
                <div class="action-name">${action.name}</div>
                <div class="action-desc">${action.desc}</div>
                <div class="action-effects">
                  ${action.effects.money ? `<span class="effect-tag effect-money">💰 ${action.effects.money[0]}-${action.effects.money[1]}万</span>` : ''}
                  ${action.effects.risk ? `<span class="effect-tag effect-risk">⚠️ 风险 ${action.effects.risk[0]}-${action.effects.risk[1]}</span>` : ''}
                  ${action.effects.integrity ? `<span class="effect-tag effect-integrity">🧭 清廉 ${action.effects.integrity > 0 ? '+' : ''}${action.effects.integrity}</span>` : ''}
                </div>
              `;
                    btn.addEventListener('click', () => performAction(action));
                    grid.appendChild(btn);
                });
            }

            function performAction(action) {
                if (state.gameOver) return;
                state.actionCount++;

                // 年龄增长
                state.age += randInt(1, 3);
                if (state.age > 70) state.age = 70;

                // 应用效果
                if (action.effects.money) {
                    const val = rand(action.effects.money[0], action.effects.money[1]);
                    state.money += val;
                    if (val > 0) addLog(`+${val.toFixed(1)}万 赃款入账。`, 'log-info');
                    if (val < 0) addLog(`支出 ${Math.abs(val).toFixed(1)}万。`, 'log-info');
                }
                if (action.effects.risk) {
                    const val = rand(action.effects.risk[0], action.effects.risk[1]);
                    state.risk += val;
                    if (val > 0) addLog(`⚠️ 风险上升 ${val.toFixed(1)}。`, 'log-warn');
                    if (val < 0) addLog(`✅ 风险下降 ${Math.abs(val).toFixed(1)}。`, 'log-good');
                }
                if (action.effects.integrity) {
                    state.integrity = clamp(state.integrity + action.effects.integrity, 0, 100);
                }

                state.risk = clamp(state.risk, 0, 100);
                state.money = Math.max(0, state.money);
                state.integrity = clamp(state.integrity, 0, 100);

                // 升职检查
                if (action.isPromotion) {
                    if (Math.random() < 0.55) {
                        promoteIfPossible(state);
                    } else {
                        addLog('升迁暂时无望，继续努力。', 'log-warn');
                    }
                }

                // 记录日志
                if (action.logGood && Math.random() < 0.65) {
                    addLog(action.logGood, 'log-good');
                } else if (action.logBad) {
                    addLog(action.logBad, 'log-bad');
                }

                // 随机事件
                if (Math.random() < 0.35 && state.actionCount > 1) {
                    triggerRandomEvent();
                }

                // 检查是否被抓
                checkArrest();

                // 检查结局
                if (!state.gameOver) {
                    checkEndings();
                }

                updateUI();

                // 重新渲染动作
                if (!state.gameOver) {
                    renderActions();
                }
            }

            function triggerRandomEvent() {
                const totalWeight = randomEvents.reduce((sum, e) => sum + e.weight, 0);
                let roll = Math.random() * totalWeight;
                for (const ev of randomEvents) {
                    roll -= ev.weight;
                    if (roll <= 0) {
                        addLog(`【事件】${ev.name}：${ev.desc}`, 'log-warn');
                        ev.apply(state);
                        break;
                    }
                }
                updateUI();
            }

            function checkArrest() {
                const arrestChance = state.risk / 100;
                const roll = Math.random();
                if (roll < arrestChance * 0.35 && state.risk > 40) {
                    // 被抓
                    state.gameOver = true;
                    state.imprisoned = true;
                    showEnding('imprisoned');
                } else if (state.risk >= 100) {
                    state.gameOver = true;
                    state.imprisoned = true;
                    showEnding('imprisoned');
                } else if (state.risk > 70 && Math.random() < 0.1) {
                    // 严重警告
                    addLog('🚨 纪委已对你展开初步调查，情况危急！', 'log-bad');
                    state.risk += 5;
                }
            }

            function checkEndings() {
                if (state.gameOver) return;
                if (state.age >= 60 && state.risk < 30) {
                    state.gameOver = true;
                    showEnding('retired_safe');
                    return;
                }
                if (state.age >= 65) {
                    if (state.risk > 50) {
                        state.gameOver = true;
                        showEnding('retired_risky');
                    } else {
                        state.gameOver = true;
                        showEnding('retired_safe');
                    }
                    return;
                }
                if (state.money >= 500 && state.risk > 60) {
                    state.gameOver = true;
                    showEnding('fled');
                    return;
                }
                if (state.money >= 1000) {
                    state.gameOver = true;
                    showEnding('mega_corrupt');
                    return;
                }
                if (state.integrity <= 10 && state.risk > 50) {
                    state.gameOver = true;
                    showEnding('exposed');
                    return;
                }
            }

            function showEnding(type) {
                const overlay = document.getElementById('modalOverlay');
                overlay.classList.remove('hidden');

                const iconEl = document.getElementById('endingIcon');
                const titleEl = document.getElementById('endingTitle');
                const statsEl = document.getElementById('finalStats');
                const descEl = document.getElementById('endingDesc');

                const endings = {
                    imprisoned: {
                        icon: '⛓️',
                        title: '锒铛入狱',
                        desc: '纪委掌握了确凿证据，你被带走调查。最终因贪污受贿罪被判处有期徒刑。铁窗之内，你回顾一生，悔之晚矣。'
                    },
                    retired_safe: {
                        icon: '🏖️',
                        title: '平稳着陆',
                        desc: '你在官场摸爬滚打一生，虽有小贪但未触及红线，最终安全退休。那些不义之财，成了你晚年的"保障"。'
                    },
                    retired_risky: {
                        icon: '😰',
                        title: '退休前的噩梦',
                        desc: '即将退休之际，纪委突然介入调查你早年间的贪腐问题。晚节不保，你的人生以悲剧收场。'
                    },
                    fled: {
                        icon: '✈️',
                        title: '卷款外逃',
                        desc: '你察觉到风声不对，带着巨额赃款潜逃海外。虽然暂时逃脱了法律制裁，但余生都在恐惧和悔恨中度过。'
                    },
                    mega_corrupt: {
                        icon: '👑',
                        title: '巨贪之王',
                        desc: '你贪腐金额超过千万，成为震惊全国的大案。虽然享受了极致的奢华，但最终难逃法网。'
                    },
                    exposed: {
                        icon: '📸',
                        title: '东窗事发',
                        desc: '你的贪腐行为被全面曝光，身败名裂。不仅失去了所有，还连累了家人。'
                    },
                };

                const ending = endings[type] || endings.imprisoned;
                iconEl.textContent = ending.icon;
                titleEl.textContent = ending.title;
                descEl.textContent = ending.desc;

                statsEl.innerHTML = `
              <div><span>最终年龄</span><span>${state.age} 岁</span></div>
              <div><span>最终职位</span><span>${state.position}</span></div>
              <div><span>贪污金额</span><span>${state.money.toFixed(1)} 万元</span></div>
              <div><span>风险值</span><span>${Math.round(state.risk)} / 100</span></div>
              <div><span>清廉度</span><span>${Math.round(state.integrity)} / 100</span></div>
              <div><span>人生选择次数</span><span>${state.actionCount} 次</span></div>
            `;
            }

            function resetGame() {
                state.age = 28;
                state.position = '科员';
                state.positionLevel = 0;
                state.money = 0;
                state.risk = 0;
                state.integrity = 50;
                state.stage = 'early';
                state.alive = true;
                state.imprisoned = false;
                state.fled = false;
                state.gameOver = false;
                state.actionCount = 0;
                state.log = [];
                state.currentActions = [];

                document.getElementById('logArea').innerHTML = `
              <div class="log-entry log-info">🔰 骆德翻，男，28岁，进入某机关单位工作，月薪微薄。</div>
              <div class="log-entry log-info">💭 面对金钱诱惑，他究竟会做出怎样的选择？</div>
            `;
                document.getElementById('modalOverlay').classList.add('hidden');
                updateUI();
                renderActions();
            }

            // ==================== 初始化 ====================
            function init() {
                updateUI();
                renderActions();
                document.getElementById('btnReset').addEventListener('click', resetGame);
                document.getElementById('btnRestartModal').addEventListener('click', resetGame);
            }

            // 页面加载完成后初始化
            init();

            // 暴露重置到全局（方便调试）
            window.resetGame = resetGame;
        })();
    </script>
</body>
</html>
