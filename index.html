<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄龙辉的一生 - 选择题人生模拟器</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #e94560;
            --gold: #f5c518;
            --text: #eee;
            --subtext: #aaa;
            --success: #2ecc71;
            --danger: #e74c3c;
            --info: #3498db;
            --border: #2a2a4a;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(233, 69, 96, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(245, 197, 24, 0.04) 0%, transparent 50%);
        }
        .game-container {
            max-width: 700px;
            width: 100%;
            background: var(--card);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--gold), var(--info), var(--accent));
            background-size: 300% 100%;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }
        .header { text-align: center; margin-bottom: 18px; }
        .header h1 {
            font-size: 2em; font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #ff8c00, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 2px; margin-bottom: 4px;
        }
        .header .subtitle { color: var(--subtext); font-size: 0.85em; letter-spacing: 3px; }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px 16px;
            margin-bottom: 15px; border: 1px solid var(--border); flex-wrap: wrap; gap: 8px;
        }
        .age-badge { font-size: 1.4em; font-weight: 700; color: var(--gold); }
        .stage-badge { background: rgba(245,197,24,0.15); color: var(--gold); padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 600; letter-spacing: 1px; }
        .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .stat-item { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 8px 4px; text-align: center; border: 1px solid var(--border); }
        .stat-item .stat-icon { font-size: 1.2em; }
        .stat-item .stat-value { font-size: 0.9em; font-weight: 700; margin: 2px 0; }
        .stat-item .stat-name { font-size: 0.65em; color: var(--subtext); letter-spacing: 1px; }
        .progress-mini { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 3px; overflow: hidden; }
        .progress-mini .bar { height: 100%; border-radius: 2px; transition: width 0.4s; }
        .stat-value.high { color: var(--success); }
        .stat-value.medium { color: var(--gold); }
        .stat-value.low { color: var(--danger); }
        .event-panel { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--border); min-height: 80px; }
        .event-text { font-size: 1.05em; line-height: 1.7; color: var(--text); margin-bottom: 8px; }
        .event-hint { font-size: 0.8em; color: var(--subtext); font-style: italic; }
        .choices-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .choice-btn {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 18px; color: var(--text); font-size: 0.95em; cursor: pointer;
            transition: all 0.25s; text-align: left; font-weight: 500; letter-spacing: 0.3px;
            position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px;
        }
        .choice-btn:hover { background: rgba(245,197,24,0.1); border-color: var(--gold); transform: translateX(5px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .choice-btn:active { transform: scale(0.97); }
        .choice-btn .choice-emoji { font-size: 1.6em; flex-shrink: 0; }
        .choice-btn .choice-detail { display: flex; flex-direction: column; }
        .choice-btn .choice-hint { font-size: 0.75em; color: var(--subtext); margin-top: 2px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
        .main-btn {
            padding: 12px 24px; border-radius: 12px; border: none; font-size: 0.95em; font-weight: 700;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px; background: rgba(255,255,255,0.1);
            color: var(--text); border: 1px solid var(--border);
        }
        .main-btn.primary { background: linear-gradient(135deg, var(--accent), #c0392b); color: #fff; box-shadow: 0 5px 25px rgba(233,69,96,0.4); }
        .main-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.2); }
        .main-btn.primary:hover { background: linear-gradient(135deg, #ff5e7e, #e74c3c); }
        .history-log { margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--border); max-height: 180px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        .history-log::-webkit-scrollbar { width: 4px; }
        .history-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .log-title { font-size: 0.8em; color: var(--subtext); letter-spacing: 2px; margin-bottom: 8px; }
        .log-item { font-size: 0.8em; color: var(--subtext); padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; gap: 8px; }
        .log-age { font-weight: 700; color: var(--gold); min-width: 40px; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:1000; animation: fadeIn 0.3s; }
        .modal { background: var(--card); border-radius: 24px; padding: 30px; max-width: 550px; width: 90%; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); animation: slideUp 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h2 { font-size: 1.8em; margin-bottom: 12px; color: var(--gold); }
        .modal .final-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .modal .final-stat { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 5px; }
        .modal .final-stat .fs-value { font-size: 1.2em; font-weight: 700; color: var(--gold); }
        .modal .life-summary { text-align: left; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin: 15px 0; line-height: 1.8; font-size: 0.85em; max-height: 250px; overflow-y: auto; }
        .hidden { display: none !important; }
        @media (max-width: 500px) {
            .game-container { padding: 16px 12px; border-radius: 16px; }
            .stats-row { grid-template-columns: repeat(3, 1fr); gap: 5px; }
            .stat-item { padding: 6px 2px; }
            .header h1 { font-size: 1.5em; }
            .choice-btn { padding: 12px 14px; font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="header">
            <h1>🏆 黄龙辉的一生</h1>
            <div class="subtitle">选择题人生模拟器 · 200+ 情境</div>
        </div>
        <div class="status-bar">
            <span class="age-badge" id="ageDisplay">0岁</span>
            <span class="stage-badge" id="stageDisplay">👶 婴儿期</span>
            <span style="color:var(--subtext);font-size:0.8em;">已选 <span id="choiceCount">0</span> 次</span>
        </div>
        <div class="stats-row" id="statsRow"></div>
        <div class="event-panel">
            <div class="event-text" id="eventText">点击下方按钮开始人生...</div>
            <div class="event-hint" id="eventHint"></div>
        </div>
        <div class="choices-area" id="choicesArea"></div>
        <div class="btn-group">
            <button class="main-btn primary" id="btnStart" onclick="startGame()">🎮 开始人生</button>
            <button class="main-btn" id="btnRestart" onclick="restartGame()" style="display:none;">🔄 重新开始</button>
        </div>
        <div class="history-log" id="historyLog" style="display:none;">
            <div class="log-title">📜 人生记录</div>
            <div id="logItems"></div>
        </div>
    </div>
    <div class="modal-overlay hidden" id="gameOverModal">
        <div class="modal">
            <h2>🏁 黄龙辉的一生完结</h2>
            <div id="finalAgeText" style="font-size:1.1em;color:var(--subtext);margin-bottom:8px;"></div>
            <div class="final-stats" id="finalStats"></div>
            <div class="life-summary" id="lifeSummary"></div>
            <button class="main-btn primary" onclick="restartGame()">🔄 再来一世</button>
        </div>
    </div>
    <script>
        // ==================== 游戏核心状态 ====================
        let game = {
            age: 0, health: 80, intelligence: 20, wealth: 0, happiness: 70, looks: 50,
            socialCredit: 60, isAlive: true, usedEvents: new Set(), choiceCount: 0,
            log: [], gameStarted: false, currentEventId: null,
            spouse: null, children: 0, house: '无', car: '无', education: '无', career: '无',
            pet: null, hobby: null, luckyCount: 0, unluckyCount: 0,
        };
        function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, v)); }
        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function formatMoney(amount) { if (amount >= 10000) return (amount/10000).toFixed(1)+'万'; if (amount >= 1000) return (amount/1000).toFixed(1)+'千'; return amount.toFixed(0); }
        function getLifeStage(age) { if(age<3) return '👶 婴儿期'; if(age<6) return '🧒 幼儿期'; if(age<12) return '🎒 童年期'; if(age<18) return '📚 青少年'; if(age<22) return '🎓 青年期'; if(age<30) return '💼 奋斗期'; if(age<40) return '🏠 成家立业'; if(age<50) return '👨‍👩‍👧 中年期'; if(age<60) return '🌅 成熟期'; if(age<70) return '🧓 老年期'; if(age<80) return '👴 古稀之年'; if(age<90) return '🕊️ 耄耋之年'; return '🌟 人瑞'; }
        function getStatColor(val) { if(val>=70) return 'high'; if(val>=40) return 'medium'; return 'low'; }
        function addLog(age, text) { game.log.push({age, text}); const lc = document.getElementById('logItems'); const item = document.createElement('div'); item.className='log-item'; item.innerHTML=`<span class="log-age">${age}岁</span><span>${text}</span>`; lc.prepend(item); while(lc.children.length>40) lc.removeChild(lc.lastChild); }
        function updateUI() {
            document.getElementById('ageDisplay').textContent = game.age + '岁';
            document.getElementById('stageDisplay').textContent = getLifeStage(game.age);
            document.getElementById('choiceCount').textContent = game.choiceCount;
            const statsData = [
                {key:'health', icon:'❤️', color:'#2ecc71', name:'健康'},
                {key:'intelligence', icon:'🧠', color:'#3498db', name:'智力'},
                {key:'wealth', icon:'💰', color:'#f5c518', name:'财富'},
                {key:'happiness', icon:'😊', color:'#e94560', name:'快乐'},
                {key:'looks', icon:'✨', color:'#9b59b6', name:'颜值'},
            ];
            const statsRow = document.getElementById('statsRow'); statsRow.innerHTML='';
            statsData.forEach(({key,icon,color,name}) => {
                let val = game[key]; let displayVal = key==='wealth' ? formatMoney(val) : Math.round(clamp(val,0,100));
                let pct = key==='wealth' ? Math.min(100, val/5) : clamp(val,0,100);
                const div = document.createElement('div'); div.className='stat-item';
                div.innerHTML=`<div class="stat-icon">${icon}</div><div class="stat-value ${getStatColor(clamp(val,0,100))}">${displayVal}</div><div class="progress-mini"><div class="bar" style="width:${pct}%;background:${color};"></div></div><div class="stat-name">${name}</div>`;
                statsRow.appendChild(div);
            });
        }
        function showEvent(event) {
            document.getElementById('eventText').textContent = event.text;
            document.getElementById('eventHint').textContent = event.hint || '';
            const ca = document.getElementById('choicesArea'); ca.innerHTML='';
            event.choices.forEach((choice, idx) => {
                const btn = document.createElement('button'); btn.className='choice-btn';
                btn.innerHTML=`<span class="choice-emoji">${choice.emoji||'👉'}</span><span class="choice-detail"><span>${choice.text}</span>${choice.hint?`<span class="choice-hint">${choice.hint}</span>`:''}</span>`;
                btn.onclick = () => handleChoice(event, idx); ca.appendChild(btn);
            });
        }
        function handleChoice(event, choiceIdx) {
            const choice = event.choices[choiceIdx];
            if(choice.effects) { for(let [key,val] of Object.entries(choice.effects)) { if(key==='wealth') game.wealth=Math.max(0, game.wealth+val); else if(key==='socialCredit') game.socialCredit=clamp(game.socialCredit+val,0,100); else game[key]=clamp(game[key]+val,0,100); } }
            if(choice.setFlag) { for(let [k,v] of Object.entries(choice.setFlag)) game[k]=v; }
            if(choice.log) addLog(game.age, choice.log);
            const inc = choice.ageIncrement || 1; game.age += inc; game.choiceCount++;
            game.usedEvents.add(event.id);
            if(choice.triggerDeath || game.health<=0 || game.age>100) { game.isAlive=false; showGameOver(); return; }
            if(game.age>100) { game.isAlive=false; showGameOver(); return; }
            nextTurn();
        }
        function nextTurn() {
            if(!game.isAlive) return; updateUI();
            const ne = getNextEvent();
            if(ne) { game.currentEventId=ne.id; showEvent(ne); }
            else { defaultYear(); }
        }
        function defaultYear() {
            game.age += 1; game.choiceCount++; addLog(game.age-1, '平淡的一年过去了');
            game.health=clamp(game.health+rand(-2,1)); game.happiness=clamp(game.happiness+rand(-2,0));
            if(game.health<=0||game.age>100) { game.isAlive=false; showGameOver(); return; }
            updateUI(); nextTurn();
        }
        function getNextEvent() {
            const available = eventPool.filter(ev => !game.usedEvents.has(ev.id) && game.age>=ev.minAge && game.age<=ev.maxAge && (ev.condition?ev.condition(game):true));
            if(available.length===0) return null;
            return available[Math.floor(Math.random()*available.length)];
        }
        function startGame() {
            if(game.gameStarted) return; game.gameStarted=true;
            document.getElementById('btnStart').style.display='none';
            document.getElementById('btnRestart').style.display='inline-block';
            document.getElementById('historyLog').style.display='block';
            const be = eventPool.find(e=>e.id==='birth');
            if(be) { game.usedEvents.add('birth'); showEvent(be); }
            else nextTurn();
            updateUI();
        }
        function restartGame() {
            game = { age:0, health:80, intelligence:20, wealth:0, happiness:70, looks:50, socialCredit:60,
                isAlive:true, usedEvents:new Set(), choiceCount:0, log:[], gameStarted:false, currentEventId:null,
                spouse:null, children:0, house:'无', car:'无', education:'无', career:'无', pet:null, hobby:null,
                luckyCount:0, unluckyCount:0 };
            document.getElementById('btnStart').style.display='inline-block';
            document.getElementById('btnRestart').style.display='none';
            document.getElementById('historyLog').style.display='none';
            document.getElementById('logItems').innerHTML='';
            document.getElementById('gameOverModal').classList.add('hidden');
            document.getElementById('choicesArea').innerHTML='';
            document.getElementById('eventText').textContent='点击下方按钮开始人生...';
            document.getElementById('eventHint').textContent='';
            updateUI();
        }
        function showGameOver() {
            document.getElementById('gameOverModal').classList.remove('hidden');
            document.getElementById('finalAgeText').textContent=`黄龙辉享年 ${game.age} 岁`;
            const sd = [
                {key:'health',label:'❤️ 健康',val:Math.round(game.health)},
                {key:'intelligence',label:'🧠 智力',val:Math.round(game.intelligence)},
                {key:'wealth',label:'💰 财富',val:formatMoney(game.wealth)},
                {key:'happiness',label:'😊 快乐',val:Math.round(game.happiness)},
                {key:'looks',label:'✨ 颜值',val:Math.round(game.looks)},
                {key:'socialCredit',label:'🏅 社会评价',val:Math.round(game.socialCredit)},
            ];
            document.getElementById('finalStats').innerHTML=sd.map(s=>`<div class="final-stat"><div>${s.label}</div><div class="fs-value">${s.val}</div></div>`).join('');
            document.getElementById('lifeSummary').innerHTML=game.log.map(l=>`${l.age}岁: ${l.text}`).join('<br>');
        }

        // ==================== 事件池 (200+ 情境) ====================
        const eventPool = [
            // ===== 出生与婴儿期 =====
            { id:'birth', minAge:0, maxAge:0, text:'👶 黄龙辉出生了！产房外，父亲紧张地搓着手。随着一声啼哭，黄龙辉来到了这个世界。', hint:'人生第一个选择', choices:[
                {emoji:'😊', text:'安稳地躺在妈妈怀里', hint:'健康+5，快乐+10', effects:{health:5, happiness:10}, log:'出生，安稳地躺在妈妈怀里'},
                {emoji:'😭', text:'大声哭闹，折腾父母', hint:'快乐-5，但引起关注', effects:{happiness:-5, looks:3}, log:'出生时哭闹不止'},
                {emoji:'😴', text:'安静地睡觉', hint:'健康+3，智力+2', effects:{health:3, intelligence:2}, log:'出生后安静睡觉'}
            ]},
            { id:'baby_name', minAge:1, maxAge:2, text:'📛 家人为黄龙辉起名，讨论热烈。', choices:[
                {emoji:'🌟', text:'叫"辉辉"，寓意光辉', hint:'快乐+5', effects:{happiness:5}, log:'起名辉辉'},
                {emoji:'🐉', text:'叫"龙龙"，霸气', hint:'社会评价+5', effects:{socialCredit:5}, log:'起名龙龙'},
                {emoji:'📚', text:'叫"黄学"，爱学习', hint:'智力+3', effects:{intelligence:3}, log:'起名黄学'}
            ]},
            { id:'baby_food', minAge:1, maxAge:2, text:'🍼 黄龙辉开始尝试辅食，妈妈准备了不同食物。', choices:[
                {emoji:'🥕', text:'胡萝卜泥，健康', hint:'健康+5', effects:{health:5}, log:'爱吃胡萝卜泥'},
                {emoji:'🍎', text:'苹果泥，甜甜的', hint:'快乐+5', effects:{happiness:5}, log:'爱吃苹果泥'},
                {emoji:'🥩', text:'肉泥，长得壮', hint:'健康+3，颜值+2', effects:{health:3, looks:2}, log:'爱吃肉泥'}
            ]},
            { id:'baby_walk', minAge:1, maxAge:2, text:'🚶 黄龙辉尝试学走路，摇摇晃晃。', choices:[
                {emoji:'👣', text:'勇敢迈出第一步', hint:'健康+5，快乐+5', effects:{health:5, happiness:5}, log:'勇敢学走路'},
                {emoji:'🧸', text:'扶着玩具慢慢走', hint:'健康+3，智力+3', effects:{health:3, intelligence:3}, log:'扶着玩具学走路'},
                {emoji:'😢', text:'摔倒了，大哭', hint:'健康-3，但学会坚强', effects:{health:-3, happiness:3}, log:'学走路摔倒了'}
            ]},
            { id:'baby_sleep', minAge:1, maxAge:2, text:'😴 黄龙辉晚上睡觉不安稳。', choices:[
                {emoji:'🌙', text:'妈妈抱着哄睡', hint:'快乐+5，健康+3', effects:{happiness:5, health:3}, log:'妈妈抱着哄睡'},
                {emoji:'📖', text:'听睡前故事', hint:'智力+5', effects:{intelligence:5}, log:'听睡前故事'},
                {emoji:'🎵', text:'听摇篮曲', hint:'快乐+8', effects:{happiness:8}, log:'听摇篮曲入睡'}
            ]},
            // ===== 幼儿期 (3-5岁) =====
            { id:'kindergarten', minAge:3, maxAge:4, text:'🏫 黄龙辉上幼儿园了！', choices:[
                {emoji:'😄', text:'开心地去幼儿园', hint:'快乐+8，智力+5', effects:{happiness:8, intelligence:5}, log:'开心上幼儿园'},
                {emoji:'😢', text:'哭着不肯去', hint:'快乐-5，但被老师安慰', effects:{happiness:-5, socialCredit:3}, log:'哭闹上幼儿园'},
                {emoji:'🤝', text:'主动交朋友', hint:'快乐+5，社交+8', effects:{happiness:5, socialCredit:8}, log:'在幼儿园交朋友'}
            ]},
            { id:'toy_choice', minAge:3, maxAge:5, text:'🧸 黄龙辉在玩具店挑选玩具。', choices:[
                {emoji:'🚗', text:'小汽车', hint:'快乐+6', effects:{happiness:6}, log:'喜欢小汽车'},
                {emoji:'🧩', text:'拼图', hint:'智力+8', effects:{intelligence:8}, log:'喜欢拼图'},
                {emoji:'⚽', text:'皮球', hint:'健康+8', effects:{health:8}, log:'喜欢玩皮球'}
