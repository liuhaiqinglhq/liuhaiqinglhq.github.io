<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2亿像素 · 多帧合成相机 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#000; color:#fff; font-family:-apple-system,"PingFang SC","HarmonyOS Sans",sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  #stage { position:relative; flex:1; overflow:hidden; background:#000; }
  #videoBox { position:absolute; left:50%; top:50%; width:100%; height:100%; transform:translate(-50%,-50%); }
  #video { width:100%; height:100%; object-fit:cover; transform-origin:center; }
  #grid { position:absolute; inset:0; pointer-events:none; opacity:.35;
    background:
      linear-gradient(to right, transparent 33.3%, rgba(255,255,255,.5) 33.3%, rgba(255,255,255,.5) 33.5%, transparent 33.5%, transparent 66.6%, rgba(255,255,255,.5) 66.6%, rgba(255,255,255,.5) 66.8%, transparent 66.8%),
      linear-gradient(to bottom, transparent 33.3%, rgba(255,255,255,.5) 33.3%, rgba(255,255,255,.5) 33.5%, transparent 33.5%, transparent 66.6%, rgba(255,255,255,.5) 66.6%, rgba(255,255,255,.5) 66.8%, transparent 66.8%); }
  #focusBox { position:absolute; width:72px; height:72px; border:2px solid #ffd400; border-radius:8px; display:none; pointer-events:none; box-shadow:0 0 12px rgba(255,212,0,.6); z-index:5; }

  #hud { position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:0; right:0; display:flex; justify-content:space-between; padding:0 14px; pointer-events:none; z-index:6; }
  .hud-chip { pointer-events:auto; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:6px 12px; font-size:12px; line-height:1.5; }
  #resChip { color:#ffd400; font-weight:600; }
  #rotBtn { cursor:pointer; color:#fff; }

  #modeBar { position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:50%; transform:translateX(-50%); display:flex; background:rgba(0,0,0,.55); backdrop-filter:blur(10px); border-radius:999px; padding:4px; border:1px solid rgba(255,255,255,.15); z-index:6; }
  .mode-btn { border:none; background:transparent; color:#bbb; font-size:13px; font-weight:600; padding:8px 18px; border-radius:999px; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .mode-btn.active { background:#ffd400; color:#000; }

  #controls { padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px); background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.55)); position:relative; z-index:7; }
  #frameRow { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  #frameRow label { font-size:12px; color:#aaa; white-space:nowrap; }
  #frameVal { font-size:12px; color:#ffd400; font-weight:700; min-width:36px; text-align:right; }
  input[type=range] { flex:1; accent-color:#ffd400; height:4px; }

  #shutterRow { display:flex; align-items:center; justify-content:space-between; }
  #thumbWrap { width:52px; height:52px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.25); background:#111; }
  #thumb { width:100%; height:100%; object-fit:cover; display:block; }
  #shutter { width:76px; height:76px; border-radius:50%; border:4px solid #fff; background:transparent; position:relative; cursor:pointer; }
  #shutter::after { content:""; position:absolute; inset:5px; border-radius:50%; background:#fff; transition:transform .12s, background .12s; }
  #shutter:active::after { transform:scale(.82); }
  #shutter.busy::after { background:#ffd400; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(.88); opacity:.7; } }
  #dlBtn { width:52px; height:52px; border-radius:12px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-size:22px; cursor:pointer; }
  #dlBtn:disabled { opacity:.3; }

  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; gap:18px; }
  #overlay.show { display:flex; }
  .ring { width:74px; height:74px; border-radius:50%; border:4px solid rgba(255,255,255,.15); border-top-color:#ffd400; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #ovText { font-size:14px; color:#eee; text-align:center; line-height:1.7; padding:0 20px; }
  #ovBarWrap { width:70%; max-width:320px; height:6px; background:rgba(255,255,255,.12); border-radius:99px; overflow:hidden; }
  #ovBar { height:100%; width:0%; background:#ffd400; border-radius:99px; transition:width .15s; }

  #resultView { position:fixed; inset:0; background:#000; display:none; z-index:60; flex-direction:column; }
  #resultView.show { display:flex; }
  #resultImgWrap { flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; touch-action:none; }
  #resultImg { width:100%; height:auto; display:block; transform-origin:0 0; }
  #resultBar { display:flex; gap:10px; padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px); }
  .rbtn { flex:1; border:none; border-radius:12px; padding:14px 0; font-size:15px; font-weight:700; cursor:pointer; }
  #saveBtn { background:#ffd400; color:#000; }
  #backBtn { background:rgba(255,255,255,.12); color:#fff; }
  #metaLine { text-align:center; font-size:11px; color:#888; padding-bottom:6px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="videoBox"><video id="video" autoplay playsinline muted></video></div>
    <div id="grid"></div>
    <div id="focusBox"></div>
    <div id="hud">
      <div class="hud-chip" id="camChip">相机初始化…</div>
      <div style="display:flex;gap:8px;">
        <div class="hud-chip" id="rotBtn">⟳ <span id="rotVal">0°</span></div>
        <div class="hud-chip" id="resChip">—</div>
      </div>
    </div>
    <div id="modeBar">
      <button class="mode-btn" data-mode="mp200">2亿像素</button>
      <button class="mode-btn active" data-mode="k4">4K 超解析</button>
    </div>
  </div>

  <div id="controls">
    <div id="frameRow">
      <label>多帧合成</label>
      <input type="range" id="frameSlider" min="4" max="32" step="2" value="16">
      <span id="frameVal">16 帧</span>
    </div>
    <div id="shutterRow">
      <div id="thumbWrap"><img id="thumb" alt=""></div>
      <button id="shutter" aria-label="拍摄"></button>
      <button id="dlBtn" disabled>⬇</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="ring"></div>
  <div id="ovText">准备中…</div>
  <div id="ovBarWrap"><div id="ovBar"></div></div>
</div>

<div id="resultView">
  <div id="resultImgWrap"><img id="resultImg" alt="合成结果" draggable="false"></div>
  <div id="metaLine"></div>
  <div id="resultBar">
    <button class="rbtn" id="backBtn">返回重拍</button>
    <button class="rbtn" id="saveBtn">保存到相册</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= 配置 ================= */
  // mp200：保持传感器比例，总像素≈2亿，长边不超过 16384（浏览器画布安全上限）
  // k4：长边 3840，保持传感器比例（4:3 传感器 → 3840×2880）
  var MODES = {
    mp200: { type:"area",  pixels: 2e8,   maxSide: 16384, name: "2亿像素" },
    k4:    { type:"edge",  longEdge: 3840,                name: "4K 超解析" }
  };
  var mode = "k4";
  var FRAME_COUNT = 16;
  var busy = false;
  var lastBlobUrl = null;
  var ROT = 0;           // 0/90/180/270，部分机型需手动校正
  var VW = 0, VH = 0;    // 相机帧实际尺寸

  var video = document.getElementById("video");
  var videoBox = document.getElementById("videoBox");
  var stage = document.getElementById("stage");
  var camChip = document.getElementById("camChip");
  var resChip = document.getElementById("resChip");
  var shutter = document.getElementById("shutter");
  var overlay = document.getElementById("overlay");
  var ovText = document.getElementById("ovText");
  var ovBar = document.getElementById("ovBar");
  var resultView = document.getElementById("resultView");
  var resultImgWrap = document.getElementById("resultImgWrap");
  var resultImg = document.getElementById("resultImg");
  var metaLine = document.getElementById("metaLine");

  /* ================= 目标尺寸计算（保持传感器比例，不再硬裁） ================= */
  function computeTarget(vw, vh){
    var m = MODES[mode];
    var f;
    if (m.type === "area"){
      f = Math.sqrt(m.pixels / (vw * vh));
      var fCap = m.maxSide / Math.max(vw, vh);
      if (f > fCap) f = fCap;
    } else {
      f = m.longEdge / Math.max(vw, vh);
    }
    return { w: Math.round(vw * f), h: Math.round(vh * f) };
  }

  function updateResChip(){
    var t = computeTarget(VW || 4000, VH || 3000);
    var mp = (t.w * t.h / 1e8).toFixed(2);
    resChip.textContent = MODES[mode].name + " · " + t.w + "×" + t.h + "（" + mp + " 亿）";
  }

  /* ================= 相机启动 ================= */
  var stream = null;
  function startCamera(){
    var constraints = {
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 99999 }, height: { ideal: 99999 } }
    };
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia(constraints).then(onStream).catch(function(){
        navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:"environment" } })
          .then(onStream).catch(showErr);
      });
    } else showErr();
  }
  function onStream(s){
    stream = s;
    video.srcObject = s;
    video.onloadedmetadata = function(){
      var t = s.getVideoTracks()[0];
      var caps = {};
      try { caps = t.getCapabilities ? t.getCapabilities() : {}; } catch(e){}
      var cw = caps.width ? caps.width.max : video.videoWidth;
      var ch = caps.height ? caps.height.max : video.videoHeight;
      VW = video.videoWidth; VH = video.videoHeight;
      camChip.textContent = "原生 " + VW + "×" + VH;
      // 自动猜测旋转：竖持手机但帧是横的 → 转 90
      var portrait = window.innerHeight > window.innerWidth;
      if (portrait && VW > VH && ROT === 0){ ROT = 90; }
      applyRotation();
      updateResChip();
    };
  }
  function showErr(){
    camChip.textContent = "无法访问相机";
    ovText.textContent = "请授权相机权限，并通过 HTTPS 访问本页面";
    overlay.classList.add("show");
  }

  /* ================= 旋转校正 ================= */
  function applyRotation(){
    document.getElementById("rotVal").textContent = ROT + "°";
    if (ROT % 180 !== 0){
      // 交换盒子的宽高再旋转，让画面铺满屏幕
      videoBox.style.width = stage.clientHeight + "px";
      videoBox.style.height = stage.clientWidth + "px";
    } else {
      videoBox.style.width = "100%";
      videoBox.style.height = "100%";
    }
    video.style.transform = "rotate(" + ROT + "deg)";
  }
  document.getElementById("rotBtn").addEventListener("click", function(){
    if (busy) return;
    ROT = (ROT + 90) % 360;
    applyRotation();
  });
  window.addEventListener("resize", applyRotation);

  /* ================= 模式切换 ================= */
  var modeBtns = document.querySelectorAll(".mode-btn");
  modeBtns.forEach(function(b){
    b.addEventListener("click", function(){
      if (busy) return;
      modeBtns.forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      mode = b.getAttribute("data-mode");
      updateResChip();
    });
  });

  /* ================= 帧数滑块 ================= */
  var slider = document.getElementById("frameSlider");
  var frameVal = document.getElementById("frameVal");
  slider.addEventListener("input", function(){
    FRAME_COUNT = +slider.value;
    frameVal.textContent = FRAME_COUNT + " 帧";
  });

  /* ================= 对焦框 ================= */
  stage.addEventListener("click", function(e){
    if (e.target.closest("#modeBar,#hud")) return;
    var box = document.getElementById("focusBox");
    var r = stage.getBoundingClientRect();
    box.style.display = "block";
    box.style.left = (e.clientX - r.left - 36) + "px";
    box.style.top  = (e.clientY - r.top  - 36) + "px";
    setTimeout(function(){ box.style.display = "none"; }, 800);
  });

  /* ================= 工具 ================= */
  function setProgress(p, text){
    ovBar.style.width = (p*100).toFixed(1) + "%";
    if (text) ovText.textContent = text;
  }
  function nextFrame(){
    return new Promise(function(res){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); });
  }

  /* ================= 多帧连拍（带旋转校正） ================= */
  function drawRotated(ctx, vw, vh){
    var rad = ROT * Math.PI / 180;
    ctx.save();
    ctx.translate(vw/2, vh/2);
    ctx.rotate(rad);
    ctx.drawImage(video, -vw/2, -vh/2);
    ctx.restore();
  }
  function captureFrames(n){
    return new Promise(function(resolve){
      var frames = [];
      var count = 0;
      function snap(){
        var c = document.createElement("canvas");
        c.width = VW; c.height = VH;
        var ctx = c.getContext("2d", { willReadFrequently: true });
        drawRotated(ctx, VW, VH);
        frames.push({ canvas: c, ctx: ctx });
        count++;
        setProgress(count / n * 0.45, "连拍采帧 " + count + " / " + n);
        if (count < n) setTimeout(snap, 60);
        else resolve(frames);
      }
      snap();
    });
  }

  /* ================= 帧对齐（块匹配平移估计） ================= */
  function alignFrames(frames){
    var rw = frames[0].canvas.width, rh = frames[0].canvas.height;
    var ref = frames[0].ctx.getImageData(0, 0, rw, rh);
    var aligned = [frames[0]];
    var SEARCH = 6, STEP = 2;
    for (var i = 1; i < frames.length; i++){
      var f = frames[i];
      var img = f.ctx.getImageData(0, 0, rw, rh);
      var bestDx = 0, bestDy = 0, bestErr = Infinity;
      for (var dy = -SEARCH; dy <= SEARCH; dy += STEP){
        for (var dx = -SEARCH; dx <= SEARCH; dx += STEP){
          var err = 0, cnt = 0;
          for (var sy = rh*0.25; sy < rh*0.75; sy += 24){
            for (var sx = rw*0.25; sx < rw*0.75; sx += 24){
              var x1 = sx + dx, y1 = sy + dy;
              if (x1 < 0 || y1 < 0 || x1 >= rw || y1 >= rh) continue;
              var p0 = (sy*rw + sx) * 4, p1 = (y1*rw + x1) * 4;
              err += Math.abs(ref.data[p0]   - img.data[p1])
                   + Math.abs(ref.data[p0+1] - img.data[p1+1])
                   + Math.abs(ref.data[p0+2] - img.data[p1+2]);
              cnt++;
            }
          }
          if (cnt && err / cnt < bestErr){ bestErr = err / cnt; bestDx = dx; bestDy = dy; }
        }
      }
      var ac = document.createElement("canvas");
      ac.width = rw; ac.height = rh;
      var actx = ac.getContext("2d", { willReadFrequently: true });
      actx.drawImage(f.canvas, bestDx, bestDy);
      aligned.push({ canvas: ac, ctx: actx });
      setProgress(0.45 + i / frames.length * 0.25, "帧对齐 " + i + " / " + (frames.length - 1));
    }
    return aligned;
  }

  /* ================= 分块均值叠加降噪 ================= */
  function averageStack(aligned){
    var rw = aligned[0].canvas.width, rh = aligned[0].canvas.height;
    var TILE = 512;
    var out = document.createElement("canvas");
    out.width = rw; out.height = rh;
    var octx = out.getContext("2d");
    var n = aligned.length;
    for (var ty = 0; ty < rh; ty += TILE){
      var th = Math.min(TILE, rh - ty);
      for (var tx = 0; tx < rw; tx += TILE){
        var tw = Math.min(TILE, rw - tx);
        var acc = new Float32Array(tw * th * 4);
        for (var i = 0; i < n; i++){
          var d = aligned[i].ctx.getImageData(tx, ty, tw, th).data;
          for (var j = 0; j < d.length; j++) acc[j] += d[j];
        }
        var res = octx.createImageData(tw, th);
        var rd = res.data;
        for (var k = 0; k < rd.length; k++) rd[k] = acc[k] / n;
        octx.putImageData(res, tx, ty);
        setProgress(0.7 + (ty / rh) * 0.15, "多帧降噪叠加…");
      }
    }
    return out;
  }

  /* ================= 超分放大（保持传感器比例） ================= */
  function superResolve(cleanCanvas, targetW, targetH){
    var out = document.createElement("canvas");
    out.width = targetW; out.height = targetH;
    var ctx = out.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(cleanCanvas, 0, 0, targetW, targetH);
    setProgress(0.88, "超分辨率重建 " + targetW + "×" + targetH + "…");
    return out;
  }

  /* ================= 全分块 USM 锐化（不爆内存） ================= */
  function unsharp(canvas, amount, radius, threshold){
    var w = canvas.width, h = canvas.height;
    var ctx = canvas.getContext("2d");
    var TILE = 512;
    var PAD = Math.ceil(radius * 2) + 2;
    var tmp = document.createElement("canvas");
    for (var ty = 0; ty < h; ty += TILE){
      var th = Math.min(TILE, h - ty);
      for (var tx = 0; tx < w; tx += TILE){
        var tw = Math.min(TILE, w - tx);
        var sw = tw + PAD * 2, sh = th + PAD * 2;
        tmp.width = sw; tmp.height = sh;
        var tctx = tmp.getContext("2d", { willReadFrequently: true });
        tctx.filter = "blur(" + radius + "px)";
        tctx.drawImage(canvas, tx - PAD, ty - PAD, sw, sh, 0, 0, sw, sh);
        tctx.filter = "none";
        var a = ctx.getImageData(tx, ty, tw, th);
        var b = tctx.getImageData(PAD, PAD, tw, th);
        var ad = a.data, bd = b.data;
        for (var i = 0; i < ad.length; i += 4){
          for (var c = 0; c < 3; c++){
            var diff = ad[i+c] - bd[i+c];
            if (diff >= threshold || diff <= -threshold){
              var v = ad[i+c] + amount * diff;
              ad[i+c] = v < 0 ? 0 : v > 255 ? 255 : v;
            }
          }
        }
        ctx.putImageData(a, tx, ty);
      }
      setProgress(0.9 + (ty / h) * 0.08, "细节增强…");
    }
    return canvas;
  }

  /* ================= 主流程 ================= */
  async function shoot(){
    if (busy || !stream) return;
    busy = true;
    shutter.classList.add("busy");
    overlay.classList.add("show");
    setProgress(0, "准备拍摄…");
    try {
      var target = computeTarget(VW, VH);

      var frames = await captureFrames(FRAME_COUNT);
      var aligned = alignFrames(frames);
      await nextFrame();

      var clean = averageStack(aligned);
      await nextFrame();

      var big = superResolve(clean, target.w, target.h);
      await nextFrame();

      var amt = mode === "mp200" ? 0.9 : 1.4;
      var rad = mode === "mp200" ? 1.2 : 1.6;
      unsharp(big, amt, rad, 2);

      setProgress(0.99, "编码输出…");
      await nextFrame();

      var blob = await new Promise(function(res){ big.toBlob(res, "image/jpeg", 0.95); });
      if (!blob) throw new Error("编码失败（可能超出浏览器画布上限，请换 4K 模式）");
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(blob);

      document.getElementById("thumb").src = lastBlobUrl;
      document.getElementById("dlBtn").disabled = false;

      resultImg.src = lastBlobUrl;
      resetResultView();
      var mp = (target.w * target.h / 1e8).toFixed(2);
      metaLine.textContent = MODES[mode].name + " · " + target.w + "×" + target.h
        + "（" + mp + " 亿像素）· " + FRAME_COUNT + " 帧合成 · "
        + (blob.size/1024/1024).toFixed(1) + " MB · 双指可放大";
      resultView.classList.add("show");
    } catch(err){
      alert("合成失败：" + (err && err.message ? err.message : err));
    } finally {
      overlay.classList.remove("show");
      shutter.classList.remove("busy");
      busy = false;
    }
  }

  /* ================= 成片查看：双指缩放 + 双击放大 ================= */
  var zoom = 1, minZoom = 1;
  function applyZoom(){
    resultImg.style.transform = "scale(" + zoom + ")";
  }
  function resetResultView(){
    zoom = 1; applyZoom();
    resultImgWrap.scrollTop = 0; resultImgWrap.scrollLeft = 0;
  }
  (function(){
    var pointers = new Map();
    var lastDist = 0, lastTap = 0;
    resultImgWrap.addEventListener("pointerdown", function(e){
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2){
        var pts = Array.from(pointers.values());
        lastDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }
      var now = Date.now();
      if (now - lastTap < 300 && pointers.size === 1){
        zoom = (zoom > 1.5) ? 1 : 4;   // 双击：100% ↔ 400%
        applyZoom();
      }
      lastTap = now;
    });
    resultImgWrap.addEventListener("pointermove", function(e){
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2){
        var pts = Array.from(pointers.values());
        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (lastDist > 0){
          zoom = Math.min(8, Math.max(1, zoom * dist / lastDist));
          applyZoom();
        }
        lastDist = dist;
      }
    });
    function up(e){ pointers.delete(e.pointerId); lastDist = 0; }
    resultImgWrap.addEventListener("pointerup", up);
    resultImgWrap.addEventListener("pointercancel", up);
    resultImgWrap.addEventListener("wheel", function(e){
      e.preventDefault();
      zoom = Math.min(8, Math.max(1, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
      applyZoom();
    }, { passive:false });
  })();

  /* ================= 事件绑定 ================= */
  shutter.addEventListener("click", shoot);
  document.getElementById("dlBtn").addEventListener("click", function(){
    if (!lastBlobUrl) return;
    var a = document.createElement("a");
    a.href = lastBlobUrl;
    a.download = MODES[mode].name + "_" + Date.now() + ".jpg";
    a.click();
  });
  document.getElementById("saveBtn").addEventListener("click", function(){
    var a = document.createElement("a");
    a.href = lastBlobUrl;
    a.download = MODES[mode].name + "_" + Date.now() + ".jpg";
    a.click();
  });
  document.getElementById("backBtn").addEventListener("click", function(){
    resultView.classList.remove("show");
  });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });

  startCamera();
  updateResChip();
})();
</script>
</body>
</html>
