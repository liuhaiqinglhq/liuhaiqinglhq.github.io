<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 母亲节快乐  🌸</title>
    <style>
        :root {
            --bg-start: #2d1b2e;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-primary: #b04a6a;
            --text-secondary: #c05565;
            --accent-pink: #FF9AB2;
            --accent-rose: #E8789A;
            --accent-coral: #FF8C94;
            --accent-peach: #FFB088;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', 'KaiTi', '楷体', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            background: var(--bg-start);
            cursor: default;
        }

        /* 背景画布 */
        canvas#bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 主场景 */
        .main-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .main-scene.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* 顶部大标题 */
        .hero-title {
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: bold;
            background: linear-gradient(135deg, #FF9AB2, #FFD1DC, #FFB3C6, #FFC2D1);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 15px rgba(255, 140, 170, 0.5));
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
            z-index: 12;
            text-align: center;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* 副标题 */
        .sub-hero {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #ffb8c9;
            letter-spacing: 0.3em;
            margin-bottom: 2rem;
            z-index: 12;
            text-shadow: 0 0 25px rgba(255, 150, 180, 0.6);
            text-align: center;
        }

        /* 气泡容器 */
        .bubbles-container {
            position: relative;
            width: 90vw;
            max-width: 650px;
            height: 55vh;
            max-height: 500px;
            z-index: 11;
            pointer-events: none;
        }

        /* 气泡卡片 */
        .bubble {
            position: absolute;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            color: var(--text-primary);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 -4px 10px rgba(0, 0, 0, 0.03);
            opacity: 0;
            transform: scale(0);
            pointer-events: auto;
            cursor: default;
            letter-spacing: 0.04em;
            transition: box-shadow 0.4s ease;
            border: 2px solid rgba(255, 200, 210, 0.6);
        }
        .bubble::after {
            content: '';
            position: absolute;
            top: 8%;
            left: 18%;
            width: 30%;
            height: 20%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }
        .bubble.show {
            animation: bubbleAppear 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards,
                bubbleFloat 5s ease-in-out infinite;
            animation-delay: var(--bubble-delay, 0s),
                calc(var(--bubble-delay, 0s) + 0.9s);
        }

        /* 气泡出现 - 从远处飘来 */
        @keyframes bubbleAppear {
            0% {
                opacity: 0;
                transform: translate(var(--bubble-start-x, 0), var(--bubble-start-y, 0)) scale(0);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
        }
        /* 气泡轻柔浮动 */
        @keyframes bubbleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(8px, -12px) scale(1.04);
            }
            50% {
                transform: translate(-5px, -6px) scale(0.98);
            }
            75% {
                transform: translate(-10px, 8px) scale(1.02);
            }
        }

        /* 气泡尺寸与颜色变体 */
        .bubble-lg {
            width: clamp(100px, 20vw, 150px);
            height: clamp(100px, 20vw, 150px);
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
        }
        .bubble-md {
            width: clamp(80px, 16vw, 120px);
            height: clamp(80px, 16vw, 120px);
            font-size: clamp(0.8rem, 2vw, 1.1rem);
        }
        .bubble-sm {
            width: clamp(65px, 13vw, 95px);
            height: clamp(65px, 13vw, 95px);
            font-size: clamp(0.7rem, 1.8vw, 0.95rem);
        }
        .bubble-xs {
            width: clamp(55px, 11vw, 80px);
            height: clamp(55px, 11vw, 80px);
            font-size: clamp(0.65rem, 1.6vw, 0.85rem);
        }

        .bubble-pink {
            color: #E8789A;
            border-color: rgba(255, 154, 178, 0.7);
        }
        .bubble-rose {
            color: #D4687C;
            border-color: rgba(232, 120, 154, 0.7);
        }
        .bubble-coral {
            color: #FF6B6B;
            border-color: rgba(255, 170, 165, 0.7);
        }
        .bubble-peach {
            color: #C05565;
            border-color: rgba(255, 176, 136, 0.7);
        }
        .bubble-blush {
            color: #B04A6A;
            border-color: rgba(255, 179, 179, 0.7);
        }

        /* 底部音乐提示 */
        .music-hint {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.85rem;
            color: rgba(255, 200, 210, 0.8);
            letter-spacing: 0.15em;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255, 150, 180, 0.5);
            animation: softBlink 3s infinite;
        }
        @keyframes softBlink {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* 信封层 */
        .envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 10, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.9s ease, visibility 0.9s ease;
            cursor: pointer;
        }
        .envelope-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .envelope-wrapper {
            position: relative;
            width: min(330px, 80vw);
            height: 230px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.5));
        }
        .envelope-wrapper:hover {
            transform: translateY(-8px);
        }
        .envelope-wrapper:active {
            transform: scale(0.95);
        }

        .envelope-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: #fef0e8;
            border-radius: 14px 14px 22px 22px;
            box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.04);
            z-index: 2;
        }
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: #fadbd8;
            border-radius: 14px 14px 42% 42%;
            transform-origin: top center;
            transform: rotateX(0deg);
            z-index: 3;
            transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }
        .envelope-wrapper.opened .envelope-flap {
            transform: rotateX(180deg);
            box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.06);
        }

        .seal {
            position: absolute;
            bottom: 42%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #f5a0b5, #c95c78);
            border-radius: 50%;
            z-index: 4;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35), inset 0 -4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.6s ease, opacity 0.4s;
        }
        .envelope-wrapper.opened .seal {
            transform: translate(-50%, 50%) scale(0.75);
            opacity: 0.65;
        }
        .seal::after {
            content: '❤️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
        }

        .letter-card {
            position: absolute;
            top: 20%;
            left: 8%;
            width: 84%;
            height: 68%;
            background: #ffffff;
            border-radius: 6px;
            z-index: 1;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.5s;
            transform: translateY(12%);
            opacity: 0.75;
            overflow: hidden;
        }
        .envelope-wrapper.opened .letter-card {
            transform: translateY(-28%);
            opacity: 1;
        }
        .letter-text {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #b04a6a;
            line-height: 1.8;
            letter-spacing: 0.05em;
            font-weight: bold;
        }
        .letter-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #c07a90;
            animation: softBlink 2s infinite;
        }

        .envelope-wrapper.flyaway {
            animation: flyUp 1.1s ease-in forwards;
        }
        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-240px) scale(0.7);
                opacity: 0;
            }
        }

        /* 点击涟漪 */
        .ripple {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 300;
            animation: rippleOut 1.2s ease-out forwards;
            border: 2px solid rgba(255, 200, 210, 0.8);
            background: radial-gradient(circle, rgba(255, 200, 210, 0.5) 0%, transparent 70%);
        }
        @keyframes rippleOut {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- 背景粒子画布 -->
    <canvas id="bgCanvas"></canvas>

    <!-- 音乐播放器（静默自动播放，用户交互后启用） -->
    <audio id="bgMusic" loop preload="auto" style="display:none;">
        <!-- 使用一首温馨的钢琴曲作为背景音乐 -->
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_a3e3e0e5c2.mp3" type="audio/mpeg">
    </audio>

    <!-- 主场景 -->
    <div class="main-scene" id="mainScene">
        <h1 class="hero-title">母亲节快乐</h1>
        <p class="sub-hero">✨ 愿时光温柔待您 ✨</p>

        <div class="bubbles-container" id="bubblesContainer">
            <!-- LOVE YOU MOM -->
            <div class="bubble bubble-lg bubble-pink"
            style="top:5%; left:50%; --bubble-delay:0s; --bubble-start-x:-60vw; --bubble-start-y:-40vh;"
        data-delay="0">LOVE YOU MOM</div>

        <!-- 永永远远 年轻 -->
        <div class="bubble bubble-md bubble-rose"
        style="top:20%; left:10%; --bubble-delay:0.4s; --bubble-start-x:-50vw; --bubble-start-y:30vh;"
    data-delay="1">永永远远<br>年轻</div>

    <!-- 妈妈，您辛苦了 -->
    <div class="bubble bubble-lg bubble-coral"
    style="top:15%; right:8%; --bubble-delay:0.7s; --bubble-start-x:60vw; --bubble-start-y:-30vh;"
data-delay="2">妈妈，您<br>辛苦了</div>

<!-- 健康 -->
<div class="bubble bubble-sm bubble-peach"
style="top:45%; left:18%; --bubble-delay:1.0s; --bubble-start-x:-40vw; --bubble-start-y:50vh;"
data-delay="3">健康</div>

<!-- 平安 -->
<div class="bubble bubble-sm bubble-blush"
style="top:50%; left:40%; --bubble-delay:1.2s; --bubble-start-x:0; --bubble-start-y:60vh;"
data-delay="4">平安</div>

<!-- 快乐 -->
<div class="bubble bubble-md bubble-pink"
style="top:42%; right:14%; --bubble-delay:1.4s; --bubble-start-x:50vw; --bubble-start-y:40vh;"
data-delay="5">快乐</div>

<!-- HAPPY MOTHER'S DAY -->
<div class="bubble bubble-lg bubble-rose"
style="bottom:10%; left:50%; --bubble-delay:1.7s; --bubble-start-x:0; --bubble-start-y:60vh;"
data-delay="6">HAPPY<br>MOTHER'S DAY</div>

<!-- 我爱您 -->
<div class="bubble bubble-sm bubble-coral"
style="bottom:20%; left:12%; --bubble-delay:2.0s; --bubble-start-x:-45vw; --bubble-start-y:40vh;"
data-delay="7">💖 我爱您</div>

<!-- 永远美丽 -->
<div class="bubble bubble-xs bubble-peach"
style="bottom:22%; right:12%; --bubble-delay:2.2s; --bubble-start-x:45vw; --bubble-start-y:30vh;"
data-delay="8">永远美丽 🌸</div>
</div>
</div>

<!-- 音乐提示 -->
<div class="music-hint" id="musicHint">🎵 轻触屏幕播放音乐 🎵</div>

<!-- 信封开屏 -->
<div class="envelope-overlay" id="envelopeOverlay">
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <div class="seal"></div>
        <div class="letter-card">
            <p class="letter-text">亲爱的妈妈<br>💌 母亲节快乐 💌</p>
            <p class="letter-hint">轻触开启</p>
        </div>
    </div>
</div>

<!-- 点击特效画布 -->
<canvas id="clickCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;pointer-events:none;"></canvas>

<script>
    (function() {
        // ============ 音乐管理 ============
        const bgMusic = document.getElementById('bgMusic');
        const musicHint = document.getElementById('musicHint');
        let musicStarted = false;

        function tryPlayMusic() {
            if (!musicStarted) {
                bgMusic.volume = 0.35;
                bgMusic.play().then(() => {
                    musicStarted = true;
                    musicHint.style.opacity = '0';
                    musicHint.style.transition = 'opacity 1s ease';
                    setTimeout(() => { musicHint.textContent = '🎵 正在播放：温馨钢琴曲 🎵';
                        musicHint.style.opacity = '1'; }, 500);
                }).catch(() => {
                    musicHint.textContent = '🎵 点击任意位置播放音乐 🎵';
                });
            }
        }

        // 用户首次交互时尝试播放
        document.addEventListener('click', tryPlayMusic, { once: false });
        document.addEventListener('touchstart', tryPlayMusic, { once: false });

        // ============ 背景粒子系统 ============
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgW, bgH, time = 0;
        const bgParticles = [];

        function resizeBg() { bgW = bgCanvas.width = window.innerWidth;
            bgH = bgCanvas.height = window.innerHeight; }
        resizeBg();
        window.addEventListener('resize', resizeBg);

        class BgParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * bgW;
                this.y = Math.random() * bgH;
                this.size = Math.random() * 2.5 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = (Math.random() - 0.5) * 0.45 - 0.15;
                this.opacity = Math.random() * 0.45 + 0.2;
                this.twinkleSpeed = Math.random() * 0.025 + 0.008;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.hue = Math.random() < 0.5 ? (Math.random() * 30 + 335) : (Math.random() * 20 + 345);
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity += Math.sin(time * this.twinkleSpeed * 55 + this.twinkleOffset) * 0.004;
                this.opacity = Math.max(0.08, Math.min(0.65, this.opacity));
                if (this.y < -20 || this.y > bgH + 20 || this.x < -20 || this.x > bgW + 20) {
                    this.reset();
                    this.y = bgH + 20;
                    this.x = Math.random() * bgW;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = `hsl(${this.hue}, 65%, 78%)`;
                ctx.shadowColor = `hsl(${this.hue}, 75%, 72%)`;
                ctx.shadowBlur = this.size * 2.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        for (let i = 0; i < 90; i++) bgParticles.push(new BgParticle());

        function drawBgGradient(ctx, w, h, t) {
            const grad = ctx.createRadialGradient(w * 0.35 + Math.sin(t * 0.28) * w * 0.16, h * 0.4 + Math.cos(t *
                0.35) * h * 0.12, w * 0.12, w * 0.5, h * 0.5, w * 1.2);
            grad.addColorStop(0, `hsl(${335+Math.sin(t*0.22)*12}, 50%, 32%)`);
            grad.addColorStop(0.4, `hsl(${348+Math.cos(t*0.28)*8}, 42%, 20%)`);
            grad.addColorStop(0.75, `hsl(${320+Math.sin(t*0.32)*16}, 38%, 11%)`);
            grad.addColorStop(1, `hsl(275, 28%, 7%)`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }

        function animateBg() {
            time += 0.016;
            bgCtx.clearRect(0, 0, bgW, bgH);
            drawBgGradient(bgCtx, bgW, bgH, time);
            bgParticles.forEach(p => { p.update();
                p.draw(bgCtx); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ============ 花瓣飘落 ============
        const petalCanvas = document.createElement('canvas');
        petalCanvas.style.cssText =
            'position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;';
        document.body.appendChild(petalCanvas);
        const petalCtx = petalCanvas.getContext('2d');
        let petalW, petalH;

        function resizePetal() { petalW = petalCanvas.width = window.innerWidth;
            petalH = petalCanvas.height = window.innerHeight; }
        resizePetal();
        window.addEventListener('resize', resizePetal);

        class Petal {
            constructor(startFromTop = true) { this.reset(startFromTop); }
            reset(startFromTop) {
                this.x = Math.random() * petalW;
                this.y = startFromTop ? -30 - Math.random() * 120 : Math.random() * petalH;
                this.size = Math.random() * 15 + 8;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.swayAmp = Math.random() * 1.8 + 0.7;
                this.swayFreq = Math.random() * 0.018 + 0.007;
                this.fallSpeed = Math.random() * 0.65 + 0.5;
                this.opacity = Math.random() * 0.45 + 0.45;
                this.hue = Math.random() < 0.6 ? (Math.random() * 20 + 342) : (Math.random() * 22 + 352);
                this.saturation = Math.random() * 25 + 65;
                this.lightness = Math.random() * 22 + 68;
                this.phase = Math.random() * Math.PI * 2;
            }
            update() {
                this.y += this.fallSpeed;
                this.x += Math.sin(time * this.swayFreq * 42 + this.phase) * this.swayAmp * 0.35;
                this.rotation += this.rotSpeed;
                if (this.y > petalH + 40) this.reset(true);
                if (this.x < -40) this.x = petalW + 40;
                if (this.x > petalW + 40) this.x = -40;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                const s = this.size;
                ctx.fillStyle = `hsl(${this.hue}, ${this.saturation}%, ${this.lightness}%)`;
                ctx.shadowColor = 'rgba(255,160,185,0.45)';
                ctx.shadowBlur = s * 0.7;
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.6);
                ctx.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.45, s * 0.3, 0, s * 0.5);
                ctx.bezierCurveTo(-s * 0.45, s * 0.3, -s * 0.5, -s * 0.4, 0, -s * 0.6);
                ctx.fill();
                ctx.restore();
            }
        }
        const petals = [];
        for (let i = 0; i < 50; i++) petals.push(new Petal(false));

        function animatePetals() {
            petalCtx.clearRect(0, 0, petalW, petalH);
            petals.forEach(p => { p.update();
                p.draw(petalCtx); });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // ============ 爱心漂浮 ============
        const heartCanvas = document.createElement('canvas');
        heartCanvas.style.cssText =
            'position:fixed;top:0;left:0;width:100%;height:100%;z-index:6;pointer-events:none;';
        document.body.appendChild(heartCanvas);
        const heartCtx = heartCanvas.getContext('2d');
        let heartW, heartH;

        function resizeHeart() { heartW = heartCanvas.width = window.innerWidth;
            heartH = heartCanvas.height = window.innerHeight; }
        resizeHeart();
        window.addEventListener('resize', resizeHeart);

        class FloatingHeart {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * heartW;
                this.y = heartH + 40 + Math.random() * 180;
                this.size = Math.random() * 20 + 9;
                this.riseSpeed = Math.random() * 0.45 + 0.3;
                this.sway = Math.random() * 1.4 + 0.5;
                this.swaySpeed = Math.random() * 0.014 + 0.005;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.phase = Math.random() * Math.PI * 2;
                this.hue = Math.random() < 0.7 ? (Math.random() * 22 + 348) : (Math.random() * 14 + 352);
                this.scalePulse = Math.random() * 0.28 + 0.86;
                this.pulseSpeed = Math.random() * 0.028 + 0.012;
            }
            update() {
                this.y -= this.riseSpeed;
                this.x += Math.sin(time * this.swaySpeed * 48 + this.phase) * this.sway * 0.4;
                this.scalePulse = 0.86 + Math.sin(time * this.pulseSpeed * 48 + this.phase) * 0.18;
                if (this.y < -50) this.reset();
                if (this.x < -30) this.x = heartW + 30;
                if (this.x > heartW + 30) this.x = -30;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                const s = this.size * this.scalePulse;
                ctx.fillStyle = `hsl(${this.hue}, 68%, 68%)`;
                ctx.shadowColor = `hsl(${this.hue}, 75%, 62%)`;
                ctx.shadowBlur = s * 1.1;
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.32);
                ctx.bezierCurveTo(-s * 0.48, -s * 0.65, -s * 0.85, -s * 0.15, 0, s * 0.48);
                ctx.bezierCurveTo(s * 0.85, -s * 0.15, s * 0.48, -s * 0.65, 0, -s * 0.32);
                ctx.fill();
                ctx.restore();
            }
        }
        const hearts = [];
        for (let i = 0; i < 22; i++) hearts.push(new FloatingHeart());

        function animateHearts() {
            heartCtx.clearRect(0, 0, heartW, heartH);
            hearts.forEach(h => { h.update();
                h.draw(heartCtx); });
            requestAnimationFrame(animateHearts);
        }
        animateHearts();

        // ============ 点击绽放特效 ============
        const clickCanvas = document.getElementById('clickCanvas');
        const clickCtx = clickCanvas.getContext('2d');
        let clickW, clickH;

        function resizeClick() { clickW = clickCanvas.width = window.innerWidth;
            clickH = clickCanvas.height = window.innerHeight; }
        resizeClick();
        window.addEventListener('resize', resizeClick);
        const clickEffects = [];

        class ClickBloom {
            constructor(x, y, scale = 1) {
                this.x = x;
                this.y = y;
                this.age = 0;
                this.maxAge = 1.5;
                this.particles = [];
                for (let i = 0; i < 20; i++) {
                    const angle = (Math.PI * 2 / 20) * i + (Math.random() - 0.5) * 0.5;
                    this.particles.push({
                        angle,
                        dist: (Math.random() * 45 + 30) * scale,
                        speed: Math.random() * 2.8 + 2.2,
                        size: (Math.random() * 5 + 3.5) * scale,
                        hue: Math.random() < 0.6 ? (Math.random() * 18 + 342) : (Math.random() *
                            25 + 12),
                        opacity: 1,
                    });
                }
            }
            update(dt) {
                this.age += dt;
                const progress = this.age / this.maxAge;
                this.particles.forEach(p => {
                    p.dist += p.speed * dt * 38;
                    p.opacity = Math.max(0, 1 - progress * 1.15);
                    p.size *= 0.994;
                });
                return this.age < this.maxAge;
            }
            draw(ctx) {
                const progress = this.age / this.maxAge;
                const alpha = Math.max(0, 1 - progress * 1.15);
                this.particles.forEach(p => {
                    const px = this.x + Math.cos(p.angle) * p.dist;
                    const py = this.y + Math.sin(p.angle) * p.dist + p.dist * 0.2;
                    ctx.save();
                    ctx.globalAlpha = p.opacity * alpha;
                    ctx.fillStyle = `hsl(${p.hue}, 72%, 68%)`;
                    ctx.shadowColor = `hsl(${p.hue}, 78%, 62%)`;
                    ctx.shadowBlur = p.size * 1.8;
                    ctx.beginPath();
                    ctx.arc(px, py, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
        }

        function addClickEffect(x, y, scale = 1) {
            clickEffects.push(new ClickBloom(x, y, scale));
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            document.body.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
            setTimeout(() => ripple.remove(), 1250);
        }

        function animateClicks() {
            clickCtx.clearRect(0, 0, clickW, clickH);
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                if (!clickEffects[i].update(0.016)) clickEffects.splice(i, 1);
                else clickEffects[i].draw(clickCtx);
            }
            requestAnimationFrame(animateClicks);
        }
        animateClicks();

        // ============ 气泡动画启动 ============
        const bubblesContainer = document.getElementById('bubblesContainer');
        const allBubbles = bubblesContainer.querySelectorAll('.bubble');
        const mainScene = document.getElementById('mainScene');

        function startBubblesAnimation() {
            allBubbles.forEach(bubble => {
                const delay = parseFloat(bubble.getAttribute('data-delay')) || 0;
                setTimeout(() => {
                    bubble.classList.add('show');
                    const rect = bubble.getBoundingClientRect();
                    addClickEffect(rect.left + rect.width / 2, rect.top + rect.height / 2,
                        0.65);
                }, delay * 1000);
            });
        }

        // ============ 信封开屏逻辑 ============
        const envelopeOverlay = document.getElementById('envelopeOverlay');
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        let envelopeOpened = false;

        function openEnvelope() {
            if (envelopeOpened) return;
            envelopeOpened = true;

            // 尝试播放音乐
            tryPlayMusic();

            envelopeWrapper.classList.add('opened');

            setTimeout(() => {
                envelopeWrapper.classList.add('flyaway');
                mainScene.classList.add('visible');
                setTimeout(startBubblesAnimation, 400);
            }, 950);

            setTimeout(() => {
                envelopeOverlay.classList.add('hidden');
            }, 1900);

            // 信封绽放
            const rect = envelopeWrapper.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    addClickEffect(cx + (Math.random() - 0.5) * 160, cy + (Math.random() - 0.5) *
                        110, 0.8);
                }, i * 90);
            }
        }

        envelopeOverlay.addEventListener('click', openEnvelope);
        envelopeOverlay.addEventListener('touchend', (e) => {
            e.preventDefault();
            openEnvelope();
        });

        // 主场景点击花朵
        document.addEventListener('click', function(e) {
            if (!envelopeOpened) return;
            tryPlayMusic();
            addClickEffect(e.clientX, e.clientY);
        });
        document.addEventListener('touchstart', function(e) {
            if (!envelopeOpened) return;
            tryPlayMusic();
            if (e.touches.length === 1) {
                addClickEffect(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        console.log('💐 母亲节快乐！愿天下所有的妈妈幸福安康！');
        console.log('🎵 背景音乐：温馨钢琴曲');
    })();
</script>
</body>
</html>
