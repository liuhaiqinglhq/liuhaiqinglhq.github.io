<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>原生高分辨率无损相机</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f4f6}
main{max-width:760px;margin:auto;padding:18px}
h1{font-size:22px;margin:4px 0 8px}.sub{color:#aab4c5;font-size:14px;line-height:1.55}
.panel{background:#151d30;border:1px solid #29344b;border-radius:16px;padding:14px;margin:14px 0}
video{width:100%;max-height:55vh;object-fit:contain;background:#05070c;border-radius:12px}
button,select{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #3b4964;background:#24314a;color:white}
button.primary{background:#2563eb;border-color:#2563eb;font-weight:700}
button:disabled{opacity:.45}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.status{white-space:pre-wrap;line-height:1.6;font-size:14px;color:#d3dbea}
.metric{font-size:19px;font-weight:700}.muted{color:#9aa8bd;font-size:12px}
.warning{color:#fbbf24}.good{color:#86efac}
label{display:block;margin:8px 0;color:#cbd5e1;font-size:14px}
a{color:#93c5fd;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>原生高分辨率 · PNG 无损保存</h1>
<p class="sub">优先使用设备的原生拍照接口。不会把小图插值放大，也不会把输出尺寸冒充成真实细节。PNG 保存的是相机照片解码后的像素，不代表传感器 RAW。</p>

<section class="panel">
  <video id="preview" autoplay playsinline muted></video>
  <div class="controls">
    <button id="start" class="primary">启动摄像头</button>
    <button id="stop" disabled>关闭摄像头</button>
  </div>
  <div id="capability" class="status" style="margin-top:12px">尚未读取设备能力。</div>
</section>

<section class="panel">
  <label for="count">连拍张数（逐张原生拍摄）</label>
  <select id="count">
    <option value="1">1 张</option><option value="3">3 张</option>
    <option value="5" selected>5 张</option><option value="8">8 张</option>
  </select>
  <p class="muted">多张拍摄用于挑选清晰度最高的一张，不做简单平均，避免运动造成重影。此版本不会声称多帧融合已创造额外真实分辨率。</p>
  <div class="controls">
    <button id="shoot" class="primary" disabled>原生拍照并保存 PNG</button>
  </div>
  <div id="result" class="status" style="margin-top:12px">等待拍摄。</div>
</section>

<section class="panel">
  <div class="metric" id="resolution">实际照片分辨率：未知</div>
  <div class="muted" id="filesize">文件大小：未知</div>
  <p class="sub warning">重要：网页能否调用原生高像素拍照，取决于浏览器、手机系统和摄像头驱动。若接口不可用，会提示原因；不会退回视频截图后伪称原生高像素。</p>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
let stream = null, track = null, imageCapture = null, lastUrl = null;
const preview = $('preview');

function setStatus(id, text){ $(id).textContent = text; }
function megapixels(w,h){ return (w*h/1e6).toFixed(2); }

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('当前浏览器不支持摄像头访问。请使用 HTTPS 页面或 localhost。');
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:3072}}
    });
    preview.srcObject = stream;
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    let lines = ['摄像头预览已启动。'];
    if(caps.width) lines.push(`视频流支持宽度范围：${caps.width.min}–${caps.width.max}`);
    if(caps.height) lines.push(`视频流支持高度范围：${caps.height.min}–${caps.height.max}`);
    if('ImageCapture' in window){
      imageCapture = new ImageCapture(track);
      try{
        const photo = await imageCapture.getPhotoCapabilities();
        lines.push('原生拍照接口：可用');
        if(photo.imageWidth) lines.push(`原生照片宽度范围：${photo.imageWidth.min}–${photo.imageWidth.max}`);
        if(photo.imageHeight) lines.push(`原生照片高度范围：${photo.imageHeight.min}–${photo.imageHeight.max}`);
      }catch(e){ lines.push('原生拍照能力读取失败：'+e.message); }
    }else{
      imageCapture = null;
      lines.push('原生拍照接口 ImageCapture：当前浏览器不支持');
    }
    setStatus('capability',lines.join('\n'));
    $('start').disabled=true; $('stop').disabled=false; $('shoot').disabled=false;
  }catch(e){
    setStatus('capability','启动失败：'+e.message+'\n请检查浏览器摄像头权限，并通过 HTTPS 打开页面。');
  }
}
function stopCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null;track=null;imageCapture=null;preview.srcObject=null;
  $('start').disabled=false;$('stop').disabled=true;$('shoot').disabled=true;
  setStatus('capability','摄像头已关闭。');
}
function sharpnessScore(imageData){
  const {data,width,height}=imageData;
  const step=Math.max(1,Math.floor(Math.min(width,height)/500));
  let sum=0,sum2=0,n=0;
  const gray=(x,y)=>{
    const i=(y*width+x)*4;
    return .299*data[i]+.587*data[i+1]+.114*data[i+2];
  };
  for(let y=step;y<height-step;y+=step){
    for(let x=step;x<width-step;x+=step){
      const c=gray(x,y)*4-gray(x-step,y)-gray(x+step,y)-gray(x,y-step)-gray(x,y+step);
      sum+=c;sum2+=c*c;n++;
    }
  }
  return n ? sum2/n-(sum/n)**2 : 0;
}
async function blobToPng(blob){
  const bitmap=await createImageBitmap(blob);
  const canvas=document.createElement('canvas');
  canvas.width=bitmap.width;canvas.height=bitmap.height;
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.drawImage(bitmap,0,0);
  bitmap.close?.();
  const png=await new Promise((resolve,reject)=>{
    canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG 编码失败')), 'image/png');
  });
  return {blob:png,width:canvas.width,height:canvas.height};
}
async function shoot(){
  if(!imageCapture){
    setStatus('result','无法进行原生高分辨率拍照：当前浏览器没有 ImageCapture.takePhoto() 支持。\n为避免虚报像素，本程序不会用预览视频截图替代。');
    return;
  }
  $('shoot').disabled=true;
  const total=Number($('count').value);
  let best=null, logs=[];
  try{
    for(let i=0;i<total;i++){
      setStatus('result',`正在原生拍摄：${i+1}/${total}…`);
      const photoBlob=await imageCapture.takePhoto();
      const decoded=await createImageBitmap(photoBlob);
      const w=decoded.width,h=decoded.height;
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const cx=c.getContext('2d',{willReadFrequently:true,alpha:false});
      cx.drawImage(decoded,0,0);decoded.close?.();
      const sampleW=Math.min(1000,w),sampleH=Math.max(1,Math.round(h*sampleW/w));
      const sample=document.createElement('canvas');sample.width=sampleW;sample.height=sampleH;
      const sx=sample.getContext('2d',{willReadFrequently:true});
      sx.drawImage(c,0,0,sampleW,sampleH);
      const score=sharpnessScore(sx.getImageData(0,0,sampleW,sampleH));
      logs.push({w,h,score,blob:photoBlob});
      if(!best || score>best.score) best={w,h,score,blob:photoBlob};
      await new Promise(r=>setTimeout(r,180));
    }
    const converted=await blobToPng(best.blob);
    const url=URL.createObjectURL(converted.blob);
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl=url;
    const a=document.createElement('a');
    a.href=url;a.download=`native_${best.w}x${best.h}_${Date.now()}.png`;
    document.body.appendChild(a);a.click();a.remove();
    const mp=megapixels(best.w,best.h);
    $('resolution').textContent=`实际照片分辨率：${best.w} × ${best.h}（${mp} MP）`;
    $('filesize').textContent=`PNG 文件大小：${(converted.blob.size/1024/1024).toFixed(2)} MB`;
    const genuine=best.w*best.h>=100000000;
    setStatus('result',
      `完成：从 ${total} 张原生照片中选出清晰度评分最高的一张。\n`+
      `照片像素：${best.w} × ${best.h} = ${mp} MP\n`+
      `保存格式：PNG（无损编码）\n`+
      (genuine?'设备输出达到 1 亿像素尺寸。':'设备本次原生照片未达到 1 亿像素；没有进行插值扩图。')+
      `\n注意：PNG 无损指保存过程不再进行有损压缩；若相机原始照片本身为 JPEG，原始传感器信息已在相机编码阶段处理。`);
  }catch(e){
    setStatus('result','拍摄失败：'+e.message+'\n可能是设备/浏览器不支持原生拍照，或相机正被其他程序占用。');
  }finally{$('shoot').disabled=false;}
}
$('start').addEventListener('click',startCamera);
$('stop').addEventListener('click',stopCamera);
$('shoot').addEventListener('click',shoot);
window.addEventListener('pagehide',stopCamera);
</script>
</body>
</html>
