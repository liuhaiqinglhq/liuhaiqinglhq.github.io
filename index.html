<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>零基础中考营 · 从0分到及格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a2a3a 0%, #0f1e2a 100%);
            font-family: 'Segoe UI', 'Roboto', 'Poppins', system-ui, sans-serif;
            padding: 16px 12px 40px;
            color: #f0f3f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* 天数选择器 */
        .day-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 16px 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .day-control {
            display: flex;
 align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }
        .day-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            padding: 6px 18px;
            border-radius: 50px;
        }
        .day-buttons button {
            background: #ffb347;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 30px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #1e2a32;
            cursor: pointer;
        }
        .day-buttons span {
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
        input[type="range"] {
            flex: 1;
            min-width: 160px;
            accent-color: #ffb347;
        }
        .tip-text {
            background: #2a3e4a;
            border-radius: 24px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 0.85rem;
            border-left: 5px solid #ffb347;
        }

        /* 通用卡片 */
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #ffb347;
            padding-left: 14px;
        }

        /* 多科目网格 */
        .subjects-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .subject-box {
            background: rgba(0,0,0,0.25);
            border-radius: 24px;
            padding: 14px 16px;
        }
        .subject-math { border-left: 5px solid #5dade2; }
        .subject-physics { border-left: 5px solid #52be80; }
        .subject-english { border-left: 5px solid #f5b041; }
        .subject-chemistry { border-left: 5px solid #c39bd3; }
        .sub-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub-content {
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.9;
        }
        .memory-tip {
            background: #f9e79f;
            color: #5e3a1c;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        /* 练习题区 */
        .question-area {
            background: #0f2a2a;
            border-radius: 28px;
            padding: 18px;
            margin: 12px 0;
        }
        .question-step {
            background: #1e3e3e;
            border-radius: 20px;
            padding: 14px;
            margin-top: 12px;
        }
        button {
            background: #ffb347;
            border: none;
            padding: 12px 16px;
            border-radius: 44px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #1e2a32;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .score-area {
            background: #2c4a3e;
            border-radius: 24px;
            padding: 14px;
            margin-top: 14px;
            text-align: center;
            display: none;
        }
        .timer-display {
            background: #00000055;
            font-size: 2.6rem;
            text-align: center;
            font-family: monospace;
            padding: 12px;
            border-radius: 50px;
            letter-spacing: 6px;
        }
        .timer-row {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }
        .small-note {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: center;
            margin-top: 10px;
        }
        hr {
            border-color: rgba(255,255,255,0.2);
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 天数选择器 + 零基础激励 -->
    <div class="day-card">
        <div class="day-control">
            <div class="day-buttons">
                <button id="dayMinus">−</button>
                <span id="currentDayShow">1</span>
                <button id="dayPlus">+</button>
            </div>
            <input type="range" id="daySlider" min="1" max="30" value="1" step="1">
            <span style="font-size:0.8rem;">/30天</span>
        </div>
        <div class="tip-text">
            🌟 零基础大将，你好！不要怕，每一个学霸都是从“啥也不会”开始的。<br>
            📖 每天只学一点点，重复就是力量！看不懂就多看两遍步骤。
        </div>
    </div>

    <!-- 今日学习内容（4大科目，每个都从零讲起） -->
    <div class="card">
        <div class="card-title">📚 今日·零基础课堂</div>
        <div id="subjectsContainer" class="subjects-grid">
            <!-- 动态加载4科内容 -->
        </div>
    </div>

    <!-- 今日练习题 + 手把手答案 -->
    <div class="card">
        <div class="card-title">✍️ 今日练习（做不对没关系）</div>
        <div class="question-area">
            <div id="dailyQuestion" style="font-size:1rem; margin-bottom:8px;">加载中...</div>
            <button id="showAnswerBtn">🔍 老师，教我做这道题（超详细步骤）</button>
            <div id="stepByStep" class="question-step" style="display:none;"></div>
        </div>
    </div>

    <!-- 每日即时测评（针对今天这4科内容，超级简单） -->
    <div class="card">
        <div class="card-title">🎯 每日测一测 · 看看记住没</div>
        <button id="startQuizBtn">📝 开始评测（5道超基础题）</button>
        <div id="quizResult" class="score-area"></div>
        <div class="small-note">✅ 哪怕只对1道也是进步！做错就回到上面再看一遍知识点。</div>
    </div>

    <!-- 专注计时器 + 脑力恢复 -->
    <div class="card">
        <div class="card-title">⏱️ 番茄钟 · 告别脑子浑浊</div>
        <div class="timer-display" id="timerText">25:00</div>
        <div class="timer-row">
            <button id="focus25">📖 专注25分钟</button>
            <button id="rest5">🧘 休息5分钟</button>
            <button id="stopTimer">⏹️ 停</button>
        </div>
        <div class="tip-text" style="margin-top:12px;">
            🧠 脑子浑浊立刻做：闭上眼，用鼻子吸气4秒→憋气7秒→嘴巴呼气8秒，做3组！
        </div>
    </div>
</div>

<script>
    // ======================= 零基础大补丸·每课4科都从0讲起 =======================
    // 第1-30天，极度简单，拒绝复杂术语
    const courseData = [];
    
    // 生成30天内容，每天数学、物理、英语、化学各一个最基础的知识点 + 生活化比喻
    for (let d = 1; d <= 30; d++) {
        // 根据天数循环不同基础模块
        const mathIdx = (d-1) % 8;
        const physicsIdx = (d-1) % 6;
        const englishIdx = (d-1) % 7;
        const chemIdx = (d-1) % 5;
        
        const mathContent = [
            {title:"🔢 数字是什么", content:"数字就是用来数数的：1个苹果、2本书。没有东西就用0表示。", example:"例：你有0块钱 → 就是没钱", tip:"记住：0表示没有"},
            {title:"➕ 正数和负数", content:"正数：比0大的数（1,2,3...）；负数：比0小的数，前面有−号，表示欠钱或温度零下。", example:"例：-5°C比0°C冷", tip:"负数就是'少了'的意思"},
            {title:"|绝对值|", content:"绝对值就是'距离'，不管方向只看远近。|−3| = 3，因为−3离0有3步。", example:"|5| = 5，|−2| = 2", tip:"把负号扔了就对了"},
            {title:"➕ 加法", content:"把两个数合并在一起。2+3=5，可以数手指。", example:"你有2颗糖，妈妈给3颗，一共5颗", tip:"加法就是越来越多"},
            {title:"➖ 减法", content:"拿走一些。5−2=3，原来5个，拿走2个剩3个。", example:"5块钱花掉2块剩3块", tip:"减法就是越来越少"},
            {title:"✖️ 乘法", content:"相同的数加很多次。3×4 = 3+3+3+3 = 12", example:"一包辣条3元，买4包就是12元", tip:"乘法是加法的快捷方式"},
            {title:"➗ 除法", content:"平均分。8÷2=4，把8个苹果平均分给2个人，每人4个。", example:"10÷5=2", tip:"除法就是平均分"},
            {title:"分数入门", content:"把一块蛋糕切成4块，取其中1块就是1/4。分子在上，分母在下。", example:"1/2就是一半", tip:"分母表示切几份，分子表示拿几份"}
        ];
        const physicsContent = [
            {title:"📏 长度单位", content:"米(m)、厘米(cm)。1米=100厘米，大概你张双臂那么宽。", example:"你的课桌高约70cm", tip:"记住1m=100cm"},
            {title:"⚡ 速度", content:"速度 = 路程 ÷ 时间。走路1分钟走60米，速度就是60米/分。", example:"汽车速度60km/h意思是1小时跑60公里", tip:"速度就是跑多快"},
            {title:"🎵 声音", content:"声音由物体振动产生，通过空气传播。没有空气（真空）听不到声音。", example:"敲桌子，手会感觉震动", tip:"震动才有声音"},
            {title:"💡 光", content:"光沿直线传播，光速超级快。影子就是光被挡住形成的。", example:"手影游戏", tip:"光是直的"},
            {title:"⚙️ 质量", content:"质量表示物体有多重（多少千克kg）。1个鸡蛋约50克。", example:"你的书包质量约5kg", tip:"质量=重量感"},
            {title:"🌊 密度", content:"密度=质量÷体积。铁比木头重就是密度大。", example:"油浮在水上，因为油密度小", tip:"密度=沉不沉"}
        ];
        const englishContent = [
            {title:"🇬🇧 be动词：am/is/are", content:"我是I am，你是You are，他是He is，她是She is，它是It is。", example:"I am a student.", tip:"口诀：我用am，你用are，is连着他她它"},
            {title:"👤 人称代词", content:"我(I)，你(you)，他(he)，她(she)，它(it)，我们(we)，你们(you)，他们(they)。", example:"He is my brother", tip:"主格做主语"},
            {title:"🔤 一般现在时", content:"表示经常做的事。主语是he/she/it时，动词加s。", example:"She likes apples.", tip:"三单加s，其他用原形"},
            {title:"📖 名词单复数", content:"一个苹果apple，多个加s apples。特殊：man→men。", example:"one book, two books", tip:"大多数加s"},
            {title:"🚫 否定句", content:"在动词前加don't或doesn't。I don't like coffee.", example:"He doesn't play football.", tip:"doesn't用于三单"},
            {title:"❓ 一般疑问句", content:"把am/is/are 或者do/does 放句首。", example:"Are you a student?", tip:"问句动词提前"},
            {title:"📍 常见介词", content:"in (在里面)，on (在上面)，under (在下面)。", example:"The book is on the desk.", tip:"in/on/under表示位置"}
        ];
        const chemistryContent = [
            {title:"🧪 物理变化", content:"没有新物质生成，只是形状或状态变了。比如水结冰、撕碎纸。", example:"把纸撕碎还是纸", tip:"没变成别的东西"},
            {title:"🔥 化学变化", content:"生成了新物质。比如木头燃烧变成灰和烟，铁生锈。", example:"鸡蛋煮熟", tip:"彻底变了样"},
            {title:"💧 水", content:"水化学式H₂O，表示2个氢原子+1个氧原子。", example:"我们喝的水", tip:"H₂O"},
            {title:"🌬️ 氧气", content:"氧气能支持燃烧，人呼吸需要氧气。", example:"蜡烛在氧气中烧得更旺", tip:"氧气助燃"},
            {title:"🧂 食盐", content:"食盐化学名氯化钠(NaCl)，咸味。", example:"炒菜放盐", tip:"NaCl"}
        ];
        
        const math = mathContent[mathIdx];
        const physics = physicsContent[physicsIdx];
        const eng = englishContent[englishIdx];
        const chem = chemistryContent[chemIdx];
        
        // 每日综合题目（简单）
        let question = "";
        let answerSteps = "";
        if (d % 4 === 1) {
            question = "① 计算：| -7 | = ?   ② 用am/is/are填空：I ___ a student.   ③ 物理：声音靠什么传播？";
            answerSteps = "【第1题】绝对值就是去掉负号 → 7 \n【第2题】I 后面用am → I am a student. \n【第3题】声音需要介质，通常靠空气传播。答案：空气";
        } else if (d % 4 === 2) {
            question = "① 3 × 4 = ?   ② She ___ (like) apples. 用like的正确形式。   ③ 铁生锈是什么变化？";
            answerSteps = "【第1题】3×4就是3个4相加=12 \n【第2题】She是三单，like加s → likes \n【第3题】铁生锈有新物质，属于化学变化";
        } else if (d % 4 === 3) {
            question = "① 8 ÷ 2 = ?   ② 速度公式是什么？   ③ 水的化学式？";
            answerSteps = "【第1题】8除以2等于4（平均分成2份每份4）\n【第2题】v = s/t （路程除以时间）\n【第3题】水是H₂O";
        } else {
            question = "① 5 - 2 = ?   ② 翻译：她是一名老师。   ③ 影子形成是因为光的什么性质？";
            answerSteps = "【第1题】5减2等于3 \n【第2句】She is a teacher. \n【第3题】光是沿直线传播，被挡住形成影子";
        }
        
        courseData.push({
            day: d,
            math: math,
            physics: physics,
            english: eng,
            chemistry: chem,
            question: question,
            answer: answerSteps
        });
    }
    
    // 当前选择天数
    let currentDay = 1;
    
    // 渲染当天完整内容
    function renderDay(day) {
        const data = courseData.find(c => c.day === day);
        if (!data) return;
        // 构建4科html
        const html = `
            <div class="subject-box subject-math">
                <div class="sub-title">📐 ${data.math.title}</div>
                <div class="sub-content">${data.math.content}<br><span class="memory-tip">⭐ 生活例：${data.math.example}</span><br><span class="memory-tip">📌 口诀/技巧：${data.math.tip}</span></div>
            </div>
            <div class="subject-box subject-physics">
                <div class="sub-title">⚡ ${data.physics.title}</div>
                <div class="sub-content">${data.physics.content}<br><span class="memory-tip">⭐ 例子：${data.physics.example}</span><br><span class="memory-tip">📌 记忆：${data.physics.tip}</span></div>
            </div>
            <div class="subject-box subject-english">
                <div class="sub-title">🇬🇧 ${data.english.title}</div>
                <div class="sub-content">${data.english.content}<br><span class="memory-tip">🔊 例句：${data.english.example}</span><br><span class="memory-tip">🎯 小口诀：${data.english.tip}</span></div>
            </div>
            <div class="subject-box subject-chemistry">
                <div class="sub-title">🧪 ${data.chemistry.title}</div>
                <div class="sub-content">${data.chemistry.content}<br><span class="memory-tip">💡 举例：${data.chemistry.example}</span><br><span class="memory-tip">🧠 一句话：${data.chemistry.tip}</span></div>
            </div>
        `;
        document.getElementById("subjectsContainer").innerHTML = html;
        document.getElementById("dailyQuestion").innerHTML = `📌 今日题目（别怕，不会就点答案）：<br>${data.question}`;
        window.currentSteps = data.answer;
        // 隐藏上次显示的步骤
        document.getElementById("stepByStep").style.display = "none";
        document.getElementById("stepByStep").innerHTML = "";
        // 更新天数滑块显示
        document.getElementById("currentDayShow").innerText = day;
        document.getElementById("daySlider").value = day;
        
        // 之前测评成绩显示
        const saved = localStorage.getItem(`quiz_score_day_${day}`);
        const quizDiv = document.getElementById("quizResult");
        if (saved !== null) {
            quizDiv.style.display = "block";
            quizDiv.innerHTML = `📊 上次本日评测得分：${saved}/5<br>继续加油，错了就回头看上面知识！`;
        } else {
            quizDiv.style.display = "none";
        }
    }
    
    // 显示详细解题步骤按钮
    document.getElementById("showAnswerBtn").addEventListener("click", () => {
        const stepDiv = document.getElementById("stepByStep");
        stepDiv.style.display = "block";
        stepDiv.innerHTML = `<strong>🧑‍🏫 零基础老师一步步教你：</strong><br><br>${(window.currentSteps || "暂无详细步骤").replace(/\n/g,'<br>')}<br><br>✨ 没看懂？再看一遍知识点，或者大声读出来！`;
    });
    
    // 每日即时测评（基于当天4科知识点，5道超简单填空题/选择题）
    function startDailyQuiz() {
        const data = courseData.find(c => c.day === currentDay);
        if (!data) return;
        // 生成5个简单题目
        let quizQuestions = [];
        // 数学
        quizQuestions.push({q: `${data.math.title}：${data.math.tip} 根据今天内容，绝对值|−4|等于？`, a: "4"});
        quizQuestions.push({q: `物理：${data.physics.title} —— ${data.physics.content.substring(0,40)}... 速度的计算公式是？`, a: "v=s/t"});
        quizQuestions.push({q: `英语：be动词填空： He ___ a boy.`, a: "is"});
        quizQuestions.push({q: `化学：${data.chemistry.title} —— 水结冰是什么变化？(物理变化/化学变化)`, a: "物理变化"});
        quizQuestions.push({q: `综合：今天学到的任何一个知识点，写出你能记住的一句话。`, a: "任意"});
        
        let score = 0;
        for (let i = 0; i < quizQuestions.length; i++) {
            let user = prompt(`📝 第${i+1}题（超基础）\n${quizQuestions[i].q}\n输入你的答案（不区分大小写）:`);
            if (i === 4) {
                if (user && user.trim().length > 1) score++;
            } else {
                if (user && user.trim().toLowerCase() === quizQuestions[i].a.toLowerCase()) score++;
            }
        }
        localStorage.setItem(`quiz_score_day_${currentDay}`, score);
        const percent = (score/5)*100;
        let advice = "";
        if (score === 0) advice = "🥺 没关系！咱从零开始，今天再读两遍知识点，明天再测！";
        else if (score <= 2) advice = "🌱 有进步！把错题对照上面步骤看一遍。";
        else if (score <= 4) advice = "👍 不错！再巩固下错的那一科。";
        else advice = "🎉 零基础大将今天很棒！继续坚持！";
        const resultDiv = document.getElementById("quizResult");
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `🎯 今日测评得分：${score}/5 （正确率${percent}%）<br>${advice}<br>❤️ 记住：每天对1题就是胜利！`;
    }
    
    // 天数切换
    document.getElementById("dayMinus").addEventListener("click", () => {
        if (currentDay > 1) currentDay--;
        renderDay(currentDay);
    });
    document.getElementById("dayPlus").addEventListener("click", () => {
        if (currentDay < 30) currentDay++;
        renderDay(currentDay);
    });
    document.getElementById("daySlider").addEventListener("input", (e) => {
        currentDay = parseInt(e.target.value);
        renderDay(currentDay);
    });
    document.getElementById("startQuizBtn").addEventListener("click", startDailyQuiz);
    
    // 计时器逻辑（简单可靠）
    let timerInterval = null;
    let remain = 1500;
    const timerEl = document.getElementById("timerText");
    function updateTimer() {
        let m = Math.floor(remain/60);
        let s = remain % 60;
        timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        if (remain <= 0 && timerInterval) {
            clearInterval(timerInterval);
            alert("⏰ 时间到！快站起来，喝口水，做深呼吸！");
        }
    }
    function setTimer(seconds) {
        if (timerInterval) clearInterval(timerInterval);
        remain = seconds;
        updateTimer();
        timerInterval = setInterval(() => {
            if (remain > 0) {
                remain--;
                updateTimer();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
                alert("专注时间结束，休息一会儿吧！");
            }
        }, 1000);
    }
    document.getElementById("focus25").addEventListener("click", () => setTimer(1500));
    document.getElementById("rest5").addEventListener("click", () => setTimer(300));
    document.getElementById("stopTimer").addEventListener("click", () => {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        remain = 1500;
        updateTimer();
    });
    
    // 初始化第1天
    renderDay(1);
</script>
</body>
</html>
