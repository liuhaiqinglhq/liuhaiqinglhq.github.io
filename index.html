<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>三点水</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #cbe5cf, #9bc09b);
            font-family: system-ui, -apple-system, 'Segoe UI', 'SF Pro Text', 'Inter', 'PingFang SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 液态玻璃整体容器 */
        .phone-app {
            max-width: 420px;
            width: 100%;
            height: 700px;
            background: rgba(248, 252, 240, 0.45);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-radius: 52px;
            box-shadow: 0 30px 50px -12px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 245, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.2, 1.2, 0.4, 1);
        }

        .phone-app:active {
            transform: scale(0.99);
        }

        /* 状态栏占位（无时间电量） */
        .status-spacer {
            height: 10px;
            background: transparent;
        }

        /* 头部 */
        .contacts-header {
            padding: 20px 20px 8px 20px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #1D3A26;
            letter-spacing: -0.5px;
        }

        /* 右侧字母索引条 (A–Z 滑动) */
        .alphabet-scroll {
            position: absolute;
            right: 6px;
            top: 100px;
            bottom: 70px;
            width: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            z-index: 20;
            background: rgba(220, 235, 190, 0.3);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 8px 0;
            user-select: none;
        }

        .alphabet-item {
            font-size: 11px;
            font-weight: 600;
            color: #3A6B3A;
            text-align: center;
            width: 22px;
            cursor: pointer;
            transition: all 0.1s ease;
            border-radius: 30px;
        }

        .alphabet-item:active {
            transform: scale(1.2);
            background: #e9da9e;
            color: #2b542b;
        }

        /* 联系人列表区域 */
        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px 20px 20px;
            scroll-behavior: smooth;
        }

        .contacts-list::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        /* 分组标题 (只显示 S 组) */
        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #4C7A4A;
            padding: 16px 0 6px 0;
            letter-spacing: -0.2px;
            background: transparent;
        }

        /* 单个联系人条目 — Q 弹卡片 */
        .contact-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 12px;
            margin: 6px 0;
            background: rgba(245, 250, 230, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            border: 0.5px solid rgba(255, 250, 180, 0.5);
            transition: all 0.28s cubic-bezier(0.34, 1.3, 0.64, 1);
            cursor: pointer;
        }

        .contact-row:active {
            transform: scale(0.96);
            background: rgba(235, 240, 200, 0.7);
            box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.2);
        }

        .avatar-bubble {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #ffdd99, #f5bc70);
            border-radius: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 14px -6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .contact-name {
            font-size: 18px;
            font-weight: 590;
            color: #1C3A26;
        }

        /* 详情弹窗 (Q弹进入动画) */
        .detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 45, 28, 0.55);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.25s ease;
        }

        .detail-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .detail-card {
            width: 330px;
            background: rgba(250, 252, 238, 0.92);
            backdrop-filter: blur(40px);
            border-radius: 64px;
            padding: 32px 24px 36px;
            border: 1px solid rgba(255, 245, 180, 0.7);
            box-shadow: 0 30px 50px -15px black;
            transform: scale(0.88) translateY(20px);
            transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.55, 1), opacity 0.3s;
            opacity: 0;
        }

        .detail-overlay.active .detail-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .detail-avatar {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .big-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffdd99, #fcb35c);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.2);
        }

        .detail-name {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            color: #2B4D2A;
            margin: 12px 0 20px 0;
        }

        .phone-panel {
            background: rgba(195, 215, 160, 0.4);
            border-radius: 60px;
            padding: 16px 20px;
            text-align: center;
            backdrop-filter: blur(8px);
            margin-bottom: 18px;
        }

        .phone-label-mini {
            font-size: 11px;
            color: #56784A;
            font-weight: 500;
        }

        .phone-number {
            font-size: 22px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 0.8px;
            color: #1F4028;
            margin-top: 6px;
            transition: all 0.2s;
        }

        .blur-phone {
            filter: blur(6px);
        }

        .code-row {
            display: flex;
            gap: 10px;
            background: rgba(230, 240, 200, 0.7);
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            margin: 14px 0 18px;
            align-items: center;
        }

        .code-row input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-family: monospace;
            outline: none;
            color: #2D542A;
            font-weight: 500;
        }

        .unlock-glass {
            background: #F9CF7C;
            border: none;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 600;
            color: #2D542A;
            transition: 0.12s linear;
            cursor: pointer;
        }

        .unlock-glass:active {
            transform: scale(0.94);
            background: #F5BC54;
        }

        .action-group {
            display: flex;
            gap: 14px;
            margin: 8px 0 12px;
        }

        .action-glass {
            flex: 1;
            background: rgba(185, 205, 140, 0.6);
            backdrop-filter: blur(8px);
            border: none;
            padding: 12px 0;
            border-radius: 60px;
            font-weight: 590;
            font-size: 15px;
            color: #2E562A;
            cursor: pointer;
            transition: 0.12s;
        }

        .action-glass:active {
            transform: scale(0.95);
            background: #e0cd8a;
        }

        .close-detail-glass {
            width: 100%;
            background: rgba(110, 120, 80, 0.45);
            border: none;
            padding: 10px;
            border-radius: 50px;
            color: #3D623A;
            font-weight: 500;
            margin-top: 8px;
            transition: 0.1s;
        }

        .close-detail-glass:active {
            transform: scale(0.96);
        }

        /* 底部极简三语 + 作者 */
        .bottom-micro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px 16px;
            background: rgba(215, 230, 180, 0.25);
            backdrop-filter: blur(12px);
            border-top: 0.5px solid rgba(210, 225, 150, 0.5);
        }

        .lang-micro {
            display: flex;
            gap: 8px;
        }

        .lang-micro span {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 30px;
            background: rgba(145, 170, 100, 0.35);
            cursor: pointer;
            transition: 0.1s;
            color: #2F5230;
        }

        .lang-micro span.active {
            background: #EDD494;
            color: #1D3A1D;
        }

        .author-micro {
            font-size: 10px;
            color: #5F8257;
            opacity: 0.75;
            letter-spacing: 0.3px;
        }

        /* 涟漪 Q弹特效 */
        .ripple-bubble {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 240, 140, 0.7), rgba(200, 225, 120, 0));
            transform: scale(0);
            animation: popRipple 0.55s ease-out forwards;
            z-index: 1100;
        }

        @keyframes popRipple {
            0% { transform: scale(0); opacity: 0.7; }
            100% { transform: scale(5); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="phone-app">
    <div class="status-spacer"></div>
    <div class="contacts-header">
        <div class="title-row">
            <span class="page-title">联系人</span>
        </div>
    </div>

    <!-- 右侧字母滑动条 (A-Z 含S) -->
    <div class="alphabet-scroll" id="alphabetScroll">
        <!-- 动态生成 A-Z -->
    </div>

    <!-- 联系人列表: 只展示沙鸡龙，位于 S 组 -->
    <div class="contacts-list" id="contactsList">
        <div class="section-title" id="sectionS">S</div>
        <div class="contact-row" id="contactShajilong">
            <div class="avatar-bubble">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3D5C3A" stroke-width="1.2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
            <span class="contact-name" id="contactNameLabel">沙鸡龙</span>
        </div>
    </div>

    <!-- 底部：三语切换极小 + 作者 -->
    <div class="bottom-micro">
        <div class="lang-micro" id="langGroup">
            <span data-lang="zh">简</span>
            <span data-lang="en">En</span>
            <span data-lang="yue">粤</span>
        </div>
        <div class="author-micro">清 · 三点水</div>
    </div>
</div>

<!-- 详情浮层 -->
<div id="detailOverlay" class="detail-overlay">
    <div class="detail-card">
        <div class="detail-avatar">
            <div class="big-avatar">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A663A" stroke-width="1.2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
        </div>
        <div class="detail-name" id="detailBuddyName">沙鸡龙</div>
        <div class="phone-panel">
            <div class="phone-label-mini">📞彭于晏 </div>
            <div class="phone-number blur-phone" id="detailPhoneSpan">???????</div>
        </div>
        <div class="code-row">
            <input type="password" id="secretCode" placeholder="验证码 78" maxlength="4" inputmode="numeric">
            <button class="unlock-glass" id="unlockPhoneBtn">获取号码</button>
        </div>
        <div class="action-group">
            <button class="action-glass" id="copyPhoneBtn">📋 复制号码</button>
        </div>
        <button class="close-detail-glass" id="closeDetailBtn">关闭</button>
    </div>
</div>

<script>
    // ======================= 真实号码配置 =======================
    const REAL_PHONE = "不知道";
    let isNumberRevealed = false;     // 号码是否已解锁
    let currentLang = 'zh';

    // 多语言词库 (只保留必要字段)
    const langDict = {
        zh: {
            pageTitle: "联系人",
            contactName: "沙鸡龙",
            detailName: "沙鸡龙",
            phoneLabel: "📞 同学专线",
            hiddenNum: "????????",
            placeholderCode: "验证码 78",
            getBtn: "获取号码",
            copyBtn: "📋 复制号码",
            closeBtn: "关闭",
            copyToastPre: "✅ 号码已复制: ",
            wrongCode: "❌ 暗号错误，试试 78",
            successMsg: "🔓 号码已显示",
            sectionS: "S"
        },
        en: {
            pageTitle: "Contacts",
            contactName: "Sha Jilong",
            detailName: "Sha Jilong",
            phoneLabel: "📞 Class Line",
            hiddenNum: "????????",
            placeholderCode: "Code 78",
            getBtn: "Reveal",
            copyBtn: "📋 Copy Number",
            closeBtn: "Close",
            copyToastPre: "✅ Copied: ",
            wrongCode: "❌ Wrong code, try 78",
            successMsg: "🔓 Number revealed",
            sectionS: "S"
        },
        yue: {
            pageTitle: "聯絡人",
            contactName: "沙雞龍",
            detailName: "沙雞龍",
            phoneLabel: "📞 同學專線",
            hiddenNum: "????????",
            placeholderCode: "密碼 78",
            getBtn: "攞號碼",
            copyBtn: "📋 複製號碼",
            closeBtn: "閂閉",
            copyToastPre: "✅ 號碼已複製: ",
            wrongCode: "❌ 暗號錯咗，試下78",
            successMsg: "🔓 號碼顯示咗",
            sectionS: "S"
        }
    };

    // DOM 元素
    const pageTitleSpan = document.querySelector('.page-title');
    const contactNameSpan = document.getElementById('contactNameLabel');
    const sectionSElem = document.getElementById('sectionS');
    const detailBuddyNameSpan = document.getElementById('detailBuddyName');
    const detailPhoneSpan = document.getElementById('detailPhoneSpan');
    const secretCodeInput = document.getElementById('secretCode');
    const unlockBtn = document.getElementById('unlockPhoneBtn');
    const copyBtn = document.getElementById('copyPhoneBtn');
    const closeDetailBtn = document.getElementById('closeDetailBtn');
    const detailOverlay = document.getElementById('detailOverlay');
    const alphabetContainer = document.getElementById('alphabetScroll');

    // 更新全部UI文字
    function updateUILanguage() {
        const dict = langDict[currentLang];
        pageTitleSpan.innerText = dict.pageTitle;
        contactNameSpan.innerText = dict.contactName;
        sectionSElem.innerText = dict.sectionS;
        detailBuddyNameSpan.innerText = dict.detailName;
        secretCodeInput.placeholder = dict.placeholderCode;
        unlockBtn.innerText = dict.getBtn;
        copyBtn.innerText = dict.copyBtn;
        closeDetailBtn.innerText = dict.closeBtn;
        // 号码显示（未解锁时根据语言显示问号占位）
        if (!isNumberRevealed) {
            detailPhoneSpan.innerText = dict.hiddenNum;
            detailPhoneSpan.classList.add('blur-phone');
        } else {
            detailPhoneSpan.innerText = REAL_PHONE;
            detailPhoneSpan.classList.remove('blur-phone');
        }
    }

    // 涟漪特效 (Q弹)
    function addRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-bubble';
        ripple.style.left = (x - 24) + 'px';
        ripple.style.top = (y - 24) + 'px';
        ripple.style.width = '48px';
        ripple.style.height = '48px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 550);
    }

    // 显示浮层并重置解锁状态 (号码显示问号)
    function openDetail() {
        const dict = langDict[currentLang];
        isNumberRevealed = false;
        detailPhoneSpan.innerText = dict.hiddenNum;
        detailPhoneSpan.classList.add('blur-phone');
        secretCodeInput.value = '';
        detailOverlay.classList.add('active');

        // 让卡片从内部产生弹性涟漪 (更有Q弹感)
        const cardRect = document.querySelector('.detail-card')?.getBoundingClientRect();
        if (cardRect) addRipple(cardRect.left + cardRect.width/2, cardRect.top + 40);
    }

    // 关闭浮层
    function closeDetail() {
        detailOverlay.classList.remove('active');
        isNumberRevealed = false;   // 下次打开还是问号
    }

    // 解锁号码 (输入78)
    function handleUnlock() {
        const inputCode = secretCodeInput.value.trim();
        const dict = langDict[currentLang];
        if (inputCode === "78") {
            isNumberRevealed = true;
            detailPhoneSpan.innerText = REAL_PHONE;
            detailPhoneSpan.classList.remove('blur-phone');
            // 灵动成功提示 (非alert 更Q)
            const tip = document.createElement('div');
            tip.innerText = dict.successMsg;
            tip.style.position = 'fixed';
            tip.style.bottom = '30%';
            tip.style.left = '50%';
            tip.style.transform = 'translateX(-50%)';
            tip.style.backgroundColor = 'rgba(60,90,50,0.85)';
            tip.style.backdropFilter = 'blur(20px)';
            tip.style.color = '#FFF3CF';
            tip.style.padding = '6px 20px';
            tip.style.borderRadius = '60px';
            tip.style.fontSize = '14px';
            tip.style.fontWeight = '500';
            tip.style.zIndex = '1200';
            tip.style.pointerEvents = 'none';
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 1500);
        } else {
            // 错误时抖动 + 错误提示
            const phonePanel = document.querySelector('.phone-panel');
            if (phonePanel) {
                phonePanel.classList.add('shake-animation');
                setTimeout(() => phonePanel.classList.remove('shake-animation'), 400);
            }
            const errTip = document.createElement('div');
            errTip.innerText = dict.wrongCode;
            errTip.style.position = 'fixed';
            errTip.style.bottom = '30%';
            errTip.style.left = '50%';
            errTip.style.transform = 'translateX(-50%)';
            errTip.style.backgroundColor = 'rgba(160,70,50,0.85)';
            errTip.style.backdropFilter = 'blur(20px)';
            errTip.style.color = '#FFEED0';
            errTip.style.padding = '6px 20px';
            errTip.style.borderRadius = '60px';
            errTip.style.fontSize = '14px';
            errTip.style.zIndex = '1200';
            document.body.appendChild(errTip);
            setTimeout(() => errTip.remove(), 1500);
        }
        // 增加涟漪反馈
        const rectBtn = unlockBtn.getBoundingClientRect();
        addRipple(rectBtn.left + rectBtn.width/2, rectBtn.top + rectBtn.height/2);
    }

    // 复制号码 (只有解锁后才能复制真实号码)
    function handleCopy() {
        const dict = langDict[currentLang];
        if (!isNumberRevealed) {
            const warnTip = document.createElement('div');
            warnTip.innerText = dict.wrongCode;
            warnTip.style.position = 'fixed';
            warnTip.style.bottom = '30%';
            warnTip.style.left = '50%';
            warnTip.style.transform = 'translateX(-50%)';
            warnTip.style.backgroundColor = 'rgba(150,70,50,0.9)';
            warnTip.style.backdropFilter = 'blur(20px)';
            warnTip.style.color = '#FFF2CF';
            warnTip.style.padding = '8px 22px';
            warnTip.style.borderRadius = '60px';
            warnTip.style.fontSize = '13px';
            warnTip.style.zIndex = '1200';
            document.body.appendChild(warnTip);
            setTimeout(() => warnTip.remove(), 1300);
            // 抖动效果
            const phonePanel = document.querySelector('.phone-panel');
            if (phonePanel) {
                phonePanel.classList.add('shake-animation');
                setTimeout(() => phonePanel.classList.remove('shake-animation'), 400);
            }
            return;
        }
        // 已解锁，复制号码
        navigator.clipboard.writeText(REAL_PHONE).then(() => {
            const toastMsg = dict.copyToastPre + REAL_PHONE;
            const copyTip = document.createElement('div');
            copyTip.innerText = toastMsg;
            copyTip.style.position = 'fixed';
            copyTip.style.bottom = '25%';
            copyTip.style.left = '50%';
            copyTip.style.transform = 'translateX(-50%)';
            copyTip.style.backgroundColor = 'rgba(70,100,55,0.85)';
            copyTip.style.backdropFilter = 'blur(20px)';
            copyTip.style.color = '#FFF7DF';
            copyTip.style.padding = '6px 22px';
            copyTip.style.borderRadius = '60px';
            copyTip.style.fontSize = '14px';
            copyTip.style.zIndex = '1200';
            document.body.appendChild(copyTip);
            setTimeout(() => copyTip.remove(), 1500);
            addRipple(event.clientX, event.clientY);
        }).catch(() => {
            alert("复制失败，请手动复制");
        });
    }

    // 构建右侧字母索引 (A-Z)
    function buildAlphabet() {
        const letters = [];
        for (let i = 65; i <= 90; i++) {
            letters.push(String.fromCharCode(i));
        }
        alphabetContainer.innerHTML = '';
        letters.forEach(letter => {
            const span = document.createElement('div');
            span.className = 'alphabet-item';
            span.innerText = letter;
            span.setAttribute('data-letter', letter);
            span.addEventListener('click', (e) => {
                e.stopPropagation();
                // 只有 S 组实际存在联系人，但如果用户点击任意字母也可滚动到 S 的位置，增强交互
                if (letter === 'S') {
                    const sectionElem = document.getElementById('sectionS');
                    if (sectionElem) {
                        sectionElem.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                } else {
                    // 其他字母因为没有实际联系人，让列表滚动到顶部并且给一个轻微震动提示
                    const listContainer = document.querySelector('.contacts-list');
                    if (listContainer) listContainer.scrollTop = 0;
                    const tipNo = document.createElement('div');
                    tipNo.innerText = `📭 暂无${letter}开头的联系人`;
                    tipNo.style.position = 'fixed';
                    tipNo.style.bottom = '30%';
                    tipNo.style.left = '50%';
                    tipNo.style.transform = 'translateX(-50%)';
                    tipNo.style.backgroundColor = 'rgba(80,80,60,0.8)';
                    tipNo.style.backdropFilter = 'blur(20px)';
                    tipNo.style.padding = '6px 16px';
                    tipNo.style.borderRadius = '40px';
                    tipNo.style.fontSize = '12px';
                    tipNo.style.color = '#F9EFCF';
                    tipNo.style.zIndex = '1200';
                    document.body.appendChild(tipNo);
                    setTimeout(() => tipNo.remove(), 1000);
                }
                // 给触摸点加涟漪
                addRipple(e.clientX, e.clientY);
            });
            alphabetContainer.appendChild(span);
        });
        // 高亮 S 的样式小提示但不强制
        const sElement = Array.from(alphabetContainer.children).find(el => el.innerText === 'S');
        if (sElement) sElement.style.fontWeight = '800';
    }

    // 三语切换绑定
    function bindLanguageSwitcher() {
        const langOptions = document.querySelectorAll('#langGroup span');
        langOptions.forEach(opt => {
            opt.addEventListener('click', (e) => {
                const langVal = opt.getAttribute('data-lang');
                if (langVal === 'zh') currentLang = 'zh';
                else if (langVal === 'en') currentLang = 'en';
                else if (langVal === 'yue') currentLang = 'yue';
                updateUILanguage();
                langOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                addRipple(e.clientX, e.clientY);
                // 如果浮层开启且号码未解锁，同步占位文字
                if (detailOverlay.classList.contains('active') && !isNumberRevealed) {
                    detailPhoneSpan.innerText = langDict[currentLang].hiddenNum;
                } else if (detailOverlay.classList.contains('active') && isNumberRevealed) {
                    detailPhoneSpan.innerText = REAL_PHONE;
                }
            });
        });
        // 默认简体高亮
        document.querySelector('#langGroup span[data-lang="zh"]').classList.add('active');
    }

    // 事件绑定
    document.getElementById('contactShajilong').addEventListener('click', (e) => {
        e.stopPropagation();
        openDetail();
        const rect = e.currentTarget.getBoundingClientRect();
        addRipple(rect.left + rect.width/2, rect.top + rect.height/2);
    });
    unlockBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleUnlock();
    });
    copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleCopy();
    });
    closeDetailBtn.addEventListener('click', () => {
        closeDetail();
    });
    detailOverlay.addEventListener('click', (e) => {
        if (e.target === detailOverlay) closeDetail();
    });
    secretCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleUnlock();
    });

    // 初始化
    buildAlphabet();
    bindLanguageSwitcher();
    updateUILanguage();
</script>
</body>
</html>
